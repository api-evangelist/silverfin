openapi: 3.2.0
info:
  title: Silverfin Financials API
  description: This is the currently supported stable version of the Silverfin API.
  version: 1.0.0
servers:
- url: https://live.getsilverfin.com
tags:
- name: Financials
paths:
  /api/v4/f/{firm_id}/companies/{company_id}/analytical_dimensions:
    get:
      tags:
      - Financials
      summary: List all analytical dimensions
      description: 'List all analytical dimensions.


        require scope(s): `financials:read`'
      security:
      - OAuth2:
        - financials:read
      operationId: getAnalyticalDimensionsList
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/v4/f/{firm_id}/companies/{company_id}/open_transactions:
    get:
      tags:
      - Financials
      summary: Get all open transactions
      description: 'This fetches all currently open transactions (payables & receivables) for

        a specific company.


        Required scope(s): `financials:transactions:read`'
      security:
      - OAuth2:
        - financials:transactions:read
      operationId: getOpenTransactions
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/v4/f/{firm_id}/companies/{company_id}/periods/{period_id}/accounts:
    get:
      tags:
      - Financials
      summary: List values of all accounts for this period
      description: 'List values of all accounts for this period.


        Required scope(s): `financials:read`'
      security:
      - OAuth2:
        - financials:read
      operationId: getAccountsValuesByPeriodId
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    account:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: account_id
                        name:
                          type: string
                        number:
                          type: string
                        number_without_suffix:
                          type: string
                        account_type:
                          type: string
                    account_reconciliation_template:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: account_reconciliation_template_id
                    value:
                      type: string
                    starred:
                      type: boolean
  /api/v4/f/{firm_id}/companies/{company_id}/periods/{period_id}/accounts/{account_id}:
    get:
      tags:
      - Financials
      summary: Get information about the account values for this period
      description: 'Get information about the account values for this period.


        Required scope(s): `financials:read`'
      security:
      - OAuth2:
        - financials:read
      operationId: getAccountContentByPeriodId
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      - name: account_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: account_id
                      name:
                        type: string
                      number:
                        type: string
                      number_without_suffix:
                        type: string
                      account_type:
                        type: string
                  account_reconciliation_template:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: account_reconciliation_template_id
                  value:
                    type: string
                  starred:
                    type: boolean
    post:
      tags:
      - Financials
      summary: Adapt information for the account for this period
      description: 'Currently the settings you can adapt on period are the

        account_reconciliation_template or the starred status.

        **account_reconciliation_template**

        When account_reconciliation_template is set, the

        account_reconciliation_template for this account for this period will be

        updated, as well as the account_reconciliation_template of the account

        itself (on a general level) and all account_reconciliation_templates for

        all periods for this account where no data is filled in.

        The template for periods where data is filled in will not be adapted.


        **starred**

        When starred is set to true, the account will be starred in this period

        and all future periods.

        When starred is set to false, the account will be unstarred in this

        period.


        Required scope(s): `financials:write`'
      security:
      - OAuth2:
        - financials:write
      operationId: updateAccountContentByPeriodId
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                account_reconciliation_template[id]:
                  type: string
                starred:
                  type: string
                  description: boolean
              required:
              - account_reconciliation_template[id]
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      - name: account_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: account_id
                      name:
                        type: string
                      number:
                        type: string
                      account_type:
                        type: string
                  account_reconciliation_template:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: account_reconciliation_template_id
                  value:
                    type: string
                  starred:
                    type: boolean
  /api/v4/f/{firm_id}/companies/{company_id}/periods/{period_id}/accounts/{account_id}/custom:
    get:
      tags:
      - Financials
      summary: Get all custom parameters of an account for this period
      description: 'Get all custom parameters of an account for this period.


        Required scope(s): `financials:read`'
      security:
      - OAuth2:
        - financials:read
      operationId: getAccountCustomProperties
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      - name: account_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    namespace:
                      type: string
                    key:
                      type: string
                    value:
                      type: string
                    owner:
                      type: object
                      properties:
                        id:
                          type: integer
                        type:
                          type: string
                    documents:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          file_name:
                            type: string
                          content:
                            type: string
                          download_url:
                            type: string
                          periods:
                            type: array
                            items:
                              type: string
                          created_by:
                            type: string
                    updated_by_id:
                      type: integer
    post:
      tags:
      - Financials
      summary: Post a custom property to an account
      description: 'Submit one or more custom properties by posting an array in properties

        containing objects with namespace, key and value.


        Required scope(s): `financials:write`'
      security:
      - OAuth2:
        - financials:write
      operationId: createAccountCustomProperties
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                properties[][namespace]:
                  type: string
                properties[][key]:
                  type: string
                properties[][value]:
                  type: string
                  description: 'The value can be one of the following types: boolean, double, integer, object, string'
                properties[]documents[][content]:
                  type: string
                  format: binary
              required:
              - properties[][namespace]
              - properties[][key]
              - properties[][value]
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      - name: account_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
    delete:
      tags:
      - Financials
      summary: Delete a custom property from an account
      description: 'Removes a custom property from an account.


        Required scope(s): `financials:write`'
      security:
      - OAuth2:
        - financials:write
      operationId: deleteAccountCustomProperty
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: namespace
        in: query
        schema:
          type: string
        required: true
      - name: key
        in: query
        schema:
          type: string
        required: true
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      - name: account_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '204':
          description: Successful empty body response
  /api/v4/f/{firm_id}/companies/{company_id}/periods/{period_id}/accounts/{account_id}/results:
    get:
      tags:
      - Financials
      summary: Get all results of an account for this period
      description: 'Get all results of an account for this period.


        Required scope(s): `financials:read`'
      security:
      - OAuth2:
        - financials:read
      operationId: getAccountResults
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      - name: account_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: 'An object with dynamic string keys where values can be booleans or strings

                  '
                additionalProperties:
                  oneOf:
                  - type: boolean
                  - type: string
                example:
                  adjustment_button_shown: false
                  counter_account_linked: false
                  at_least_one_counter_account_selected: false
                  unreconciled_amount: '-2500.0'
  /api/v4/f/{firm_id}/companies/{company_id}/periods/{period_id}/financials/adjustments:
    get:
      tags:
      - Financials
      summary: List all adjustments
      description: 'List all adjustments.


        Required scope(s): `financials:read`'
      security:
      - OAuth2:
        - financials:read
      operationId: getAdjustmentsList
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: adjustment_id
                    posted_at:
                      type: string
                    ulid:
                      type: integer
                    category:
                      type: string
                    tags:
                      type: array
                      items:
                        type: string
                    original_adjustment:
                      type: object
                      properties:
                        type:
                          type: string
                        period:
                          type: string
                        ulid:
                          type: string
                    transactions:
                      type: array
                      items:
                        type: object
                        properties:
                          description:
                            type: string
                          value:
                            type: string
                          account:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: account_id
                              name:
                                type: string
                              number:
                                type: string
                              original_name:
                                type: string
                              original_number:
                                type: string
                              number_without_suffix:
                                type: string
                              account_type:
                                type: string
    post:
      tags:
      - Financials
      summary: Create a new adjustment
      description: 'Create a new adjustment.


        Required scope(s): `financials:write`'
      security:
      - OAuth2:
        - financials:write
      operationId: createAdjustment
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                transactions[][account][number]:
                  type: string
                transactions[][account][name]:
                  type: string
                transactions[][value]:
                  type: string
                transactions[][description]:
                  type: string
                transactions[][analytical_dimension_0]:
                  type: string
                transactions[][analytical_dimension_1]:
                  type: string
                transactions[][analytical_dimension_2]:
                  type: string
                transactions[][analytical_dimension_3]:
                  type: string
              required:
              - transactions[][account][number]
              - transactions[][value]
              - transactions[][description]
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: adjustment_id
                    posted_at:
                      type: string
                    ulid:
                      type: integer
                    category:
                      type: string
                    tags:
                      type: array
                      items:
                        type: string
                    original_adjustment:
                      type: object
                      properties:
                        type:
                          type: string
                        period:
                          type: string
                        ulid:
                          type: string
                    transactions:
                      type: array
                      items:
                        type: object
                        properties:
                          description:
                            type: string
                          value:
                            type: string
                          account:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: account_id
                              name:
                                type: string
                              number:
                                type: string
                              original_name:
                                type: string
                              original_number:
                                type: string
                              number_without_suffix:
                                type: string
                              account_type:
                                type: string
  /api/v4/f/{firm_id}/companies/{company_id}/periods/{period_id}/financials/adjustments/{adjustment_id}:
    delete:
      tags:
      - Financials
      summary: Destroy an adjustment
      description: 'Destroy an adjustment.


        Required scope(s): `financials:write`'
      security:
      - OAuth2:
        - financials:write
      operationId: deleteAdjustment
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      - name: adjustment_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '204':
          description: Successful empty body response
    post:
      tags:
      - Financials
      summary: Update an adjustment
      description: 'Update an adjustment.


        Required scope(s): `financials:write`'
      security:
      - OAuth2:
        - financials:write
      operationId: updateAdjustment
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                transactions[][account][number]:
                  type: string
                transactions[][account][name]:
                  type: string
                transactions[][value]:
                  type: integer
                  format: double
                transactions[][description]:
                  type: string
                transactions[][analytical_dimension_0]:
                  type: string
                transactions[][analytical_dimension_1]:
                  type: string
                transactions[][analytical_dimension_2]:
                  type: string
                transactions[][analytical_dimension_3]:
                  type: string
              required:
              - transactions[][account][number]
              - transactions[][value]
              - transactions[][description]
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      - name: adjustment_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: adjustment_id
                    posted_at:
                      type: string
                    ulid:
                      type: integer
                    category:
                      type: string
                    tags:
                      type: array
                      items:
                        type: string
                    original_adjustment:
                      type: object
                      properties:
                        type:
                          type: string
                        period:
                          type: string
                        ulid:
                          type: string
                    transactions:
                      type: array
                      items:
                        type: object
                        properties:
                          description:
                            type: string
                          value:
                            type: string
                          account:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: account_id
                              name:
                                type: string
                              number:
                                type: string
                              original_name:
                                type: string
                              original_number:
                                type: string
                              number_without_suffix:
                                type: string
                              account_type:
                                type: string
  /api/v4/f/{firm_id}/companies/{company_id}/periods/{period_id}/financials/balances:
    get:
      tags:
      - Financials
      summary: List all balances
      description: 'List all balances.


        Required scope(s): `financials:read`'
      security:
      - OAuth2:
        - financials:read
      operationId: getBalancesList
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: account_id
                    name:
                      type: string
                    number:
                      type: string
                    number_without_suffix:
                      type: string
                    original_name:
                      type: string
                    original_number:
                      type: string
                    account_type:
                      type: string
                    value:
                      type: string
                    adjustments_internal_value:
                      type: string
                    adjustments_external_value:
                      type: string
  /api/v4/f/{firm_id}/companies/{company_id}/periods/{period_id}/period_specific_documents:
    get:
      tags:
      - Financials
      summary: List all documents uploaded to templates
      description: 'This will only show documents on reconciliations or accounts,

        if the document is on the period or company it will not appear here


        Required scope(s): `financials:read`'
      security:
      - OAuth2:
        - financials:read
      operationId: getPeriodSpecificDocumentsList
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: search_name
        in: query
        schema:
          type: string
        description: When set only documents with this name are returned.
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
