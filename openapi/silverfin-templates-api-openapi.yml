openapi: 3.2.0
info:
  title: Silverfin Templates API
  description: This is the currently supported stable version of the Silverfin API.
  version: 1.0.0
servers:
- url: https://live.getsilverfin.com
tags:
- name: Templates
paths:
  /api/v4/f/{firm_id}/account_templates:
    get:
      tags:
      - Templates
      summary: List all account templates in this firm
      description: 'List all account templates in this firm.


        Required scope(s): `administration:read`'
      security:
      - OAuth2:
        - administration:read
      operationId: getAccountTemplatesList
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: account_template_id
                    marketplace_template_id:
                      type: integer
                    account_range:
                      type: string
                    text_configuration:
                      type: string
                    name_nl:
                      type: string
                    name_fr:
                      type: string
                    name_en:
                      type: string
                    name_da:
                      type: string
                    text:
                      type: string
                    text_parts:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          content:
                            type: string
                    mapping_list_ranges:
                      type: array
                      items:
                        type: object
                        properties:
                          account_mapping_list_id:
                            type: integer
                          account_range:
                            type: string
                    externally_managed:
                      type: boolean
    post:
      tags:
      - Templates
      summary: Create a new account template
      description: 'Create a new account template.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: createAccountTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountTemplateCreateRequest'
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTemplateCreateResponse'
  /api/v4/f/{firm_id}/account_templates/{id}:
    delete:
      tags:
      - Templates
      summary: Remove an account template
      description: 'Remove an account template.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: deleteAccountTemplate
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: Identifier of the account template
      responses:
        '204':
          description: Successful empty body response
    get:
      tags:
      - Templates
      summary: Show all properties of a certain account template
      description: 'Show all properties of a certain account template.


        Required scope(s): `administration:read`'
      security:
      - OAuth2:
        - administration:read
      operationId: getAccountTemplateContent
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: Identifier of the account template
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportFileTemplate'
    post:
      tags:
      - Templates
      summary: Update an existing account template
      description: 'Update an existing account template.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: updateAccountTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountTemplateUpdateRequest'
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: Identifier of the account template
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTemplateUpdateResponse'
  /api/v4/f/{firm_id}/account_templates/{id}/shared_parts/{shared_part_id}:
    delete:
      tags:
      - Templates
      summary: Remove a shared part from an account template
      description: 'Remove a shared part from an account template.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: deleteSharedPartfromAccountTemplate
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: shared_part_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: Identifier of the account template
      responses:
        '204':
          description: Successful empty body response
    post:
      tags:
      - Templates
      summary: Add a shared part to an account template
      description: 'Add a shared part to an account template.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: addSharedPartToAccountTemplate
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: shared_part_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: Identifier of the account template
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTemplateUpdateRequest'
  /api/v4/f/{firm_id}/export_files:
    get:
      tags:
      - Templates
      summary: List all existing export file templates
      description: 'List all existing export file templates.


        Required scope(s): `administration:read`'
      security:
      - OAuth2:
        - administration:read
      operationId: getExportFileTemplatesList
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExportFileTemplateInfo'
    post:
      tags:
      - Templates
      summary: Create a new export file template
      description: 'Create a new export file template.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: createExportFileTemplate
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/ExportFileTemplateNew'
              - $ref: '#/components/schemas/ExportFileTemplateNewWithLocale'
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportFileTemplate'
  /api/v4/f/{firm_id}/export_files/{id}:
    get:
      tags:
      - Templates
      summary: Get details of an export file template
      description: 'Get details of an export file template.


        Required scope(s): `administration:read`'
      security:
      - OAuth2:
        - administration:read
      operationId: getExportFileTemplateContent
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportFileTemplate'
    post:
      tags:
      - Templates
      summary: Update an existing export file template
      description: 'Update an existing export file template.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: updateExportFileTemplate
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/ExportFileTemplateNew'
              - $ref: '#/components/schemas/ExportFileTemplateNewWithLocale'
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportFileTemplate'
    delete:
      tags:
      - Templates
      summary: Delete an export file template
      description: 'Delete an export file template.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: deleteExportFileTemplate
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '204':
          description: Successful empty body response
  /api/v4/f/{firm_id}/export_files/{id}/shared_parts/{shared_part_id}:
    delete:
      tags:
      - Templates
      summary: Remove a shared part from an export file
      description: 'Remove a shared part from an export file.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: deleteSharedPartFromExportFileTemplate
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: id
        in: path
        schema:
          type: integer
        description: Identifier of the export file
        required: true
      - name: shared_part_id
        in: path
        schema:
          type: integer
        required: true
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '204':
          description: Successful empty body response
    post:
      tags:
      - Templates
      summary: Add a shared part to an export file
      description: 'Add a shared part to an export file.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: addSharedPartToExportFileTemplate
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: id
        in: path
        schema:
          type: integer
        description: Identifier of the export file
        required: true
      - name: shared_part_id
        in: path
        schema:
          type: integer
        required: true
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: export_file_template_id
                  marketplace_template_id:
                    type: integer
                  name:
                    type: string
                  file_name:
                    type: string
                  externally_managed:
                    type: boolean
                  enconding:
                    type: string
  /api/v4/f/{firm_id}/export_pdfs:
    get:
      tags:
      - Templates
      summary: List all existing export pdf styles
      description: 'List all existing export pdf styles.


        Required scope(s): `administration:read`'
      security:
      - OAuth2:
        - administration:read
      operationId: getExportPdfTemplatesList
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: export_pdf_id
                    name:
                      type: string
  /api/v4/f/{firm_id}/permanent_texts:
    get:
      tags:
      - Templates
      summary: List all permanent texts active in this firm
      description: 'List all permanent texts active in this firm.


        Required scopes: `administration:read`'
      security:
      - OAuth2:
        - administration:read
      operationId: getPermanentTextTemplateList
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: permanent_text_template_id
                    name:
                      type: string
                    mother_version:
                      type: integer
                    locked:
                      type: boolean
                    created_at:
                      type: string
  /api/v4/f/{firm_id}/reconciliations:
    get:
      tags:
      - Templates
      summary: List all reconciliations active in this firm
      description: 'List all reconciliations active in this firm.


        Required scope(s): `administration:read`'
      security:
      - OAuth2:
        - administration:read
      operationId: getReconciliationTextTemplateList
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReconciliationTextUpdateResponse'
    post:
      tags:
      - Templates
      summary: Create a new reconciliation
      description: 'Create a new reconciliation.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: createReconciliationTextTemplate
      requestBody:
        content:
          application/jsoan:
            schema:
              $ref: '#/components/schemas/ReconciliationTextCreateRequest'
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationTextCreateResponse'
  /api/v4/f/{firm_id}/reconciliations/test:
    post:
      tags:
      - Templates
      summary: Initiate a liquid test run
      description: 'Initiate a liquid test run.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: createLiquidTestRun
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                template[handle]:
                  type: string
                template[auto_hide_formula]:
                  type: string
                template[name_nl]:
                  type: string
                template[name_fr]:
                  type: string
                template[name_en]:
                  type: string
                template[text_configuration]:
                  type: string
                template[text]:
                  type: string
                template[text_parts][][name]:
                  type: string
                template[text_parts][][content]:
                  type: string
                template[text_shared_parts][][name]:
                  type: string
                template[text_shared_parts][][content]:
                  type: string
                template[reconciliation_type]:
                  type: string
                tests:
                  type: string
                test_line:
                  type: string
              required:
              - tests
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: integer
                description: test_run_id
  /api/v4/f/{firm_id}/reconciliations/test_runs/{id}:
    get:
      tags:
      - Templates
      summary: Check results of a liquid test run
      description: 'Check results of a liquid test run.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: getReconciliationTextTemplateLiquidTestRun
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: started, completed, test_error, internal_error
                  error_message:
                    type: string
                  error_line_number:
                    type: integer
  /api/v4/f/{firm_id}/reconciliations/verify_liquid:
    post:
      tags:
      - Templates
      summary: Lint Liquid code
      description: 'Lint liquid code.


        Required scope(s):`administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: lintLiquidCode
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: liquid code to verify
                context[reconciliation]:
                  type: boolean
                  description: Default set to false
                  default: false
              required:
              - code
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response with liquid errors
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    row:
                      type: integer
                    text:
                      type: string
                    type:
                      type: string
                      example: warning
  /api/v4/f/{firm_id}/reconciliations/{reconciliation_id}:
    get:
      tags:
      - Templates
      summary: Get details of a reconciliation template
      description: 'Get details of a reconciliation template.


        Required scope(s): `administration:read`'
      security:
      - OAuth2:
        - administration:read
      operationId: getReconciliationTextTemplateContent
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
        example: '{{firm_id}}'
      - name: reconciliation_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationTextUpdateResponse'
    post:
      tags:
      - Templates
      summary: Update a reconciliation template
      description: 'Update a reconciliation template.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: updateReconciliationTextTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationTextUpdateRequest'
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
        example: '{{firm_id}}'
      - name: reconciliation_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationTextUpdateResponse'
    delete:
      tags:
      - Templates
      summary: Remove a reconciliation template
      description: 'Remove a reconciliation template.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: deleteReconciliationTextTemplate
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: reconciliation_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '204':
          description: Successful empty body response
  /api/v4/f/{firm_id}/reconciliations/{reconciliation_id}/shared_parts/{shared_part_id}:
    delete:
      tags:
      - Templates
      summary: Remove a shared part from a reconciliation
      description: 'Remove a shared part from a reconciliation.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: deleteSharedPartFromReconciliationTextTemplate
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: reconciliation_id
        in: path
        schema:
          type: integer
        required: true
      - name: shared_part_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '204':
          description: Successful empty body response
    post:
      tags:
      - Templates
      summary: Add a shared part to a reconciliation
      description: 'Add a shared part to a reconciliation.


        Required scope(s):`administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: addSharedPartToReconciliationTextTemplate
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
