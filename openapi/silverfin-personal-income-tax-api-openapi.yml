openapi: 3.2.0
info:
  title: Silverfin Personal Income Tax API
  description: This is the currently supported stable version of the Silverfin API.
  version: 1.0.0
servers:
- url: https://live.getsilverfin.com
tags:
- name: Personal Income Tax
paths:
  /api/v4/f/{firm_id}/companies/{company_id}/personal_income_tax/{year}/document:
    post:
      tags:
      - Personal Income Tax
      summary: Attach a document to PIT workflow
      description: 'Attach a PDF document to the PIT workflow for the specified year.


        Required scope(s): `financials:write`'
      security:
      - OAuth2:
        - financials:write
      operationId: attachPersonalIncomeTaxDocument
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
        description: The firm ID
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
        description: The company ID
      - name: year
        in: path
        schema:
          type: integer
        required: true
        description: The tax year (e.g., 2024)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - source
              properties:
                file:
                  type: string
                  format: binary
                  description: A PDF document to attach to the PIT workflow
                source:
                  type: string
                  enum:
                  - my_minfin
                  - tax_on_web
                  - questionnaire
                  - manual
                  description: Declares where this file is originating from
      responses:
        '201':
          description: Document attached successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Document ID
                  name:
                    type: string
                    description: Document name
                  downloadable:
                    type: boolean
                  size:
                    type: integer
                    description: File size in bytes
                  content_type:
                    type: string
                    description: MIME type of the document
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
  /api/v4/f/{firm_id}/companies/{company_id}/personal_income_tax/{year}/metadata:
    post:
      tags:
      - Personal Income Tax
      summary: Update PIT metadata
      description: 'Update metadata for a PIT file for a given year.


        Currently available metadata: deadline_date


        Required scope(s): `financials:write`'
      security:
      - OAuth2:
        - financials:write
      operationId: updatePersonalIncomeTaxMetadata
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
        description: The firm ID
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
        description: The company ID
      - name: year
        in: path
        schema:
          type: integer
        required: true
        description: The tax year (e.g., 2024)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  type: object
                  properties:
                    deadline_date:
                      type: string
                      format: date
                      description: Deadline date in YYYY-MM-DD format
      responses:
        '200':
          description: Metadata updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      deadline_date:
                        type: string
                        format: date
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
  /api/v4/f/{firm_id}/companies/{company_id}/personal_income_tax/{year}/questionnaire:
    get:
      tags:
      - Personal Income Tax
      summary: Get PIT questionnaire data
      description: 'Get data from PIT questionnaire for the specified year.


        Required scope(s): `financials:read`'
      security:
      - OAuth2:
        - financials:read
      operationId: getPersonalIncomeTaxQuestionnaire
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
        description: The firm ID
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
        description: The company ID
      - name: year
        in: path
        schema:
          type: integer
        required: true
        description: The tax year (e.g., 2024)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  questionnaire:
                    type: object
                    properties:
                      immovable_properties:
                        type: array
                        items:
                          type: object
                          properties:
                            street:
                              type: string
                              description: Property street address.
                            number:
                              type: string
                              description: Property number.
                            box:
                              type: string
                              description: 'Property address: Post box number (Belgian address component).'
                            postal_code:
                              type: string
                              description: Property postal code.
                            city:
                              type: string
                              description: Property city.
                            country:
                              type: string
                              description: 'Property country: Country related to the property.'
                            date_of_acquisition:
                              type: string
                              description: 'Property date of acquisition: Related to property purchase.'
                            non_indexed_cadastral_income:
                              type: number
                              description: Property non-indexed cadastral income.
                            date_of_sale:
                              type: string
                              description: Property date of sale.
                            date_of_change:
                              type: string
                              description: Property date of change; related to property changes.
                            new_non_indexed_cadastral_income:
                              type: number
                              description: 'Property: New non-indexed cadastral income after change.'
                            type:
                              type: string
                              description: Type of property.
                            right_of_use_received:
                              type: string
                              description: Related to type of right of use received.
                            right_of_use_explanation:
                              type: string
                              description: Property right of use explanation.
                            date_leasehold:
                              type: string
                              description: Property date related to leasehold.
                            name_and_address_receiver:
                              type: string
                              description: Property related to the name and address of the receiver.
                            ownership_type_main:
                              type: string
                              description: Property ownership type for main.
                            third_party_ownership_percentage:
                              type: number
                              description: Related to ownership percentage held by third parties.
                            ownership_percentage_main:
                              type: number
                              description: Property ownership percentage for main applicant.
                            received_leasehold_and_fees_main:
                              type: number
                              description: 'Property: Leasehold and fees received for main applicant.'
                            paid_leasehold_and_fees_main:
                              type: number
                              description: 'Property: Leasehold and fees paid for main applicant.'
                            ownership_type_partner:
                              type: string
                              description: Property ownership type related to partner.
                            ownership_percentage_partner:
                              type: number
                              description: Property ownership percentage for partner.
                            received_leasehold_and_fees_partner:
                              type: number
                              description: 'Property: Leasehold and fees received related to partner.'
                            paid_leasehold_and_fees_partner:
                              type: number
                              description: 'Property: leasehold and fees paid by partner.'
                            loan_applicable:
                              type: string
                              description: Yes/No boolean. Related to loan applicability for tax deduction.
                            uuid:
                              type: string
                              description: Unique identifier for the immovable property.
                            destinations_and_partitions:
                              type: array
                              description: Property destination and partition details (e.g., self-inhabited, rented).
                              items:
                                type: object
                                properties:
                                  yes_no:
                                    type: string
                                    description: Yes/No boolean.
                                  start_date:
                                    type: string
                                    description: Start date of the destination/partition period.
                                  received_rent:
                                    type: number
                                    description: Received rent amount.
                                  percentage_furnished:
                                    type: number
                                    description: Percentage furnished for the property's destination and partition.
                                  percentage_cadastral_income:
                                    type: number
                                    description: Related to cadastral income percentage.
                                  mandated_manager:
                                    type: string
                                    description: Related to mandated property manager.
                                  maintenance_costs:
                                    type: number
                                    description: Maintenance costs amount.
                                  end_date:
                                    type: string
                                    description: End date of the destination/partition period.
                                  destination:
                                    type: string
                                    description: Property destination.
                                  uuid:
                                    type: string
                                    description: Unique identifier for the destination and partition.
                                required:
                                - uuid
                            loans:
                              type: array
                              items:
                                type: object
                                properties:
                                  type_of_house:
                                    type: string
                                    description: Type of house related to the loan.
                                  end_date:
                                    type: string
                                    description: Loan end date.
                                  early_reimbursement_date:
                                    type: string
                                    description: Date related to early loan reimbursement, if applicable.
                                  amount:
                                    type: number
                                    description: Loan amount for the immovable property.
                                  mortgage_registration:
                                    type: number
                                    description: Loan mortgage registration amount.
                                  duration_extension_covid:
                                    type: integer
                                    description: Related to COVID-related loan duration extension.
                                  date_end_renovation_works:
                                    type: string
                                    description: Related to end date of renovation works for this loan.
                                  amount_renovation_vat_included:
                                    type: number
                                    description: Related to renovation loan amount, VAT included.
                                  date_commissioning_new_housing:
                                    type: string
                                    description: Date of commissioning related to new housing loan.
                                  number_children_on_date:
                                    type: integer
                                    description: Number of children on reference date related to loan.
                                  of_which_disabled:
                                    type: integer
                                    description: Related to disabled children.
                                  percentage_co_borrower:
                                    type: number
                                    description: Percentage related to co-borrower of loan.
                                  percentage_housing_rented_on_date:
                                    type: number
                                    description: Loan percentage related to housing rented on date.
                                  capital_repaid:
                                    type: number
                                    description: Capital repaid for loan related to immovable property.
                                  interest_paid:
                                    type: number
                                    description: Loan interest amount paid for the property.
                                  additional_refinancing:
                                    type: string
                                    description: Related to additional refinancing.
                                  ownership_historic_main:
                                    type: number
                                    description: Historic ownership percentage for main applicant.
                                  ownership_historic_partner:
                                    type: number
                                    description: Related to historic ownership percentage for partner.
                                  who_borrowed_main:
                                    type: string
                                    description: Yes/No boolean. Related to main applicant being the borrower.
                                  who_borrowed_partner:
                                    type: string
                                    description: Yes/No boolean. Related to whether partner borrowed.
                                  housing_on_date_main:
                                    type: string
                                    description: Yes/No boolean. Related to main taxpayer occupancy of housing on reference date.
                                  housing_on_date_partner:
                                    type: string
                                    description: Yes/No boolean. Related to partner's housing on reference date.
                                  housing_only_main:
                                    type: string
                                    description: Yes/No boolean. Related to main applicant's only housing status regarding the loan.
                                  housing_only_partner:
                                    type: string
                                    description: Yes/No boolean. Related to the partner's only housing status for this loan.
                                  housing_still_only_main:
                                    type: string
                                    description: Yes/No boolean. Related to only housing for main applicant.
                                  housing_still_only_partner:
                                    type: string
                                    description: Yes/No boolean. Related to partner's only housing status for the loan.
                                  renovation_finished:
                                    type: string
                                    description: Yes/No boolean. Related to whether renovation works are finished for loan.
                                  residential_bonus:
                                    type: string
                                    description: Yes/No boolean. Whether residential bonus applies.
                                  debt_balance_insurance_contracted:
                                    type: string
                                    description: Yes/No boolean. Related to debt balance insurance contracted.
                                  purpose_loan:
                                    type: string
                                    description: Loan purpose related to immovable property.
                                  loan_contract_date:
                                    type: string
                                    description: Date the loan contract was signed.
                                  additional_loan:
                                    type: string
                                    description: Yes/No boolean. Related to additional loan.
                                  uuid:
                                    type: string
                                    description: Unique identifier for the loan.
                                  refinancings:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        type_of_house:
                                          type: string
                                          description: Type of house related to the refinancing.
                                        end_date:
                                          type: string
                                          description: Refinancing end date related to the loan for immovable property.
                                        early_reimbursement_date:
                                          type: string
                                          description: Date of early reimbursement, related to the refinancing of the loan.
                                        amount:
                                          type: number
                                          description: Refinancing amount related to the immovable property loan.
                                        mortgage_registration:
                                          type: number
                                          description: Refinancing mortgage registration amount.
                                        duration_extension_covid:
                                          type: integer
                                          description: Related to COVID loan duration extension.
                                        remaining_capital:
                                          type: number
                                          description: Remaining loan capital.
                                        number_children_on_date:
                                          type: integer
                                          description: Related to the number of children on a specific date.
                                        of_which_disabled:
                                          type: integer
                                          description: Related to disabled children count in refinancing.
                                        percentage_co_borrower:
                                          type: number
                                          description: Percentage related to co-borrower.
                                        capital_repaid:
                                          type: number
                                          description: Refinancing capital repaid.
                                        interest_paid:
                                          type: number
                                          description: 'Related to refinancing: interest amount paid.'
                                        ownership_historic_main:
                                          type: number
                                          description: Related to ownership percentage for main applicant.
                                        ownership_historic_partner:
                                          type: number
                                          description: Refinancing historic ownership percentage related to partner.
                                        who_borrowed_main:
                                          type: string
                                          description: Yes/No boolean. Related to borrower for main applicant.
                                        who_borrowed_partner:
                                          type: string
                                          description: Yes/No boolean. Related to partner as a borrower.
                                        housing_only_main:
                                          type: string
                                          description: Yes/No boolean. Related to main taxpayer's only housing.
                                        housing_only_partner:
                                          type: string
                                          description: Yes/No boolean. Related to housing status for partner.
                                        housing_still_only_main:
                                          type: string
                                          description: Yes/No boolean. Related to main applicant's only housing status.
                                        housing_still_only_partner:
                                          type: string
                                          description: Yes/No boolean. Related to housing, for partner.
                                        residential_bonus:
                                          type: string
                                          description: Yes/No boolean. Related to residential bonus.
                                        debt_balance_insurance_contracted:
                                          type: string
                                          description: Yes/No boolean. Related to debt balance insurance on refinancing.
                                        type_refinancing:
                                          type: string
                                          description: Type of refinancing.
                                        refinancing_contract_date:
                                          type: string
                                          description: Date refinancing contract was signed.
                                        refinanced_again:
                                          type: string
                                          description: Yes/No boolean. Related to whether the loan was refinanced again.
                                        uuid:
                                          type: string
                                          description: Unique identifier for the refinancing.
                                      required:
                                      - uuid
                                  loan_debt_insurance_contracts:
                                    type: array
                                    description: Loan debt insurance contracts linked to the loan.
                                    items:
                                      type: object
                                      properties:
                                        applicant_insured:
                                          type: string
                                        date_contract:
                                          type: string
                                          description: Date the insurance contract was signed.
                                        name_insurance_company:
                                          type: string
                                        paid_premium:
                                          type: number
                                        contract_number_insurance:
                                          type: string
                                          description: Insurance contract number related to the loan debt insurance contract.
                                        uuid:
                                          type: string
                                          description: Unique identifier for the loan debt insurance contract.
                                      required:
                                      - uuid
                                required:
                                - uuid
                          required:
                          - uuid
                      life_insurance_contracts:
                        type: array
                        description: List of standalone life insurance contracts related to the Belgian PIT.
                        items:
                          type: object
                          properties:
                            applicant_insured:
                              type: string
                            date_contract:
                              type: string
                              description: Date the insurance contract was signed.
                            name_insurance_company:
                              type: string
                            paid_premium:
                              type: number
                            uuid:
                              type: string
                              description: Unique identifier for the life insurance contract.
                          required:
                          - uuid
    post:
      tags:
      - Personal Income Tax
      summary: Submit PIT questionnaire data
      description: 'Post data to PIT via questionnaire.


        **WARNING:** Each request REPLACES ALL previously submitted questionnaire data for the specified year.

        Any fields not included in the request will be deleted.


        Required scope(s): `financials:write`'
      security:
      - OAuth2:
        - financials:write
      operationId: createPersonalIncomeTaxQuestionnaire
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
        description: The firm ID
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
        description: The company ID
      - name: year
        in: path
        schema:
          type: integer
        required: true
        description: The tax year (e.g., 2024)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                questionnaire:
                  type: object
                  properties:
                    iban_number:
                      type: string
                      description: IBAN number for taxpayer's bank account; used for refunds or direct debit.
                    cost_type_net_income:
                      type: string
                      description: Related to eligible net income types.
                    cost_rate_net_income:
                      type: integer
                      description: Related to net income cost rate.
                    additional_children:
                      type: array
                      items:
                        type: object
                        properties:
                          income_categories:
                            type: array
                            description: Additional child income category objects, attributes within each category.
                            items:
                              type: object
                              properties:
                                actual_costs:
                                  type: number
                                received_income:
                                  type: number
                                income_association_activities_subcategory:
                                  type: string
                                profits_subcategory:
                                  type: string
                                other_income_subcategory:
                                  type: string
                                maintenance_allowance_subcategory:
                                  type: string
                                pension_income_subcategory:
                                  type: string
                                wages_subcategory:
                                  type: string
                                selected_income_category:
                                  type: string
                          properties_income:
                            type: array
                            description: Children's property income objects, with attributes for each income-generating property.
                            items:
                              type: object
                              properties:
                                actual_costs:
                                  type: number
                                cadastral_income:
                                  type: number
                                rented_property_boolean:
                                  type: string
                                  description: Yes/No boolean value.
                                property_income_subcategory:
                                  type: string
                    additional_dependents:
                      type: array
                      description: Additional dependents list, each with income category and property income objects.
                      items:
                        type: object
                        properties:
                          income_categories:
                            type: array
                            items:
                              type: object
                              properties:
                                received_income:
                                  type: number
                          properties_income:
                            type: array
                            items:
                              type: object
                              properties:
                                actual_costs:
                                  type: number
                                cadastral_income:
                                  type: number
                                rented_property_boolean:
                                  type: string
                                  description: Yes/No boolean value.
                    alimony_beneficiaries:
                      type: array
                      description: Array of alimony beneficiaries' details (name, address, etc.) for deduction calculation.
                      items:
                        type: object
                        properties:
                          beneficiary_address:
                            type: string
                            description: Beneficiary address related to alimony.
                          beneficiary_first_name:
                            type: string
                            description: Related to the beneficiary's first name.
                          beneficiary_last_name:
                            type: string
                            description: Beneficiary last name related to alimony.
                          beneficiary_country:
                            type: string
                            description: Related to the beneficiary's country.
                          beneficiary_monthly_amount:
                            type: number
                            description: Related to monthly alimony amount for beneficiary.
                    alimony_debtors:
                      type: array
                      description: List of alimony debtors.
                      items:
                        type: object
                        properties:
                          debtor_address:
                            type: string
                            description: Related to alimony debtor address.
                          debtor_first_name:
                            type: string
                            description: Related to debtor's first name.
                          debtor_last_name:
                            type: string
                            description: Debtor's last name related to alimony payments.
                          debtor_country:
                            type: string
                            description: Related to alimony debtor country.
                    children:
                      type: array
                      description: List of child objects for PIT calculation, including personal information.
                      items:
                        type: object
                        properties:
                          surname:
                            type: string
                            description: Surname related to a child.
                          first_name:
                            type: string
                            description: Related to child's first name.
                          date_of_birth:
                            type: string
                            format: date
                            description: Related to child's birth.
                          child_has_income:
                            type: string
                            description: Related to child's income. Yes/No boolean value.
                          child_has_disability:
                            type: string
                            description: Related to child's disability status. Yes/No boolean value.
                          child_dependency_type:
                            type: string
                            description: Related to child dependency type.
                          date_of_death:
                            type: string
                            format: date
                            description: Related to child's death.
                          childcare_applicable:
                            type: string
                            description: Related to childcare expenses for this child. Yes/No boolean value.
                          months_child_lived_in_belgium:
                            type: string
                            description: Related to the number of months child lived in Belgium.
                    childcare_expenses:
                      type: array
                      description: List of children for whom childcare expenses are claimed.
                      items:
                        type: object
                        properties:
                          paid_amount:
                            type: number
                          number_of_days:
                            type: integer
                          daily_rate:
                            type: number
                          childcare_name:
                            type: string
                          child_name:
                            type: string
                    copyright_income_new_cost_type:
                      type: string
                      description: Related to type of copyright income eligible for new income scheme.
                    copyright_income_cost_type_transitional:
                      type: string
                      description: Related to copyright income eligible for a transitional arrangement.
                    foreign_bank_accounts:
                      type: array
                      description: Foreign bank accounts of the taxpayer, partner, or children; reported by the taxpayer.
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            description: Foreign bank account name or foreign life insurance contract name.
                          discontinued:
                            type: boolean
                            description: Related to if the bank account has been closed.
                          cpc_checkbox:
                            type: boolean
                            description: Central Point of Contact declaration checkbox.
                          country_dropdown:
                            type: string
                            description: Country related to the foreign bank account.
                    movable_income_foreign_income_items:
                      type: array
                      description: Exemptions for foreign movable income (dividends, interest, etc.)
                      items:
                        type: object
                        properties:
                          country:
                            type: string
                          amount:
                            type: number
                          nature:
                            type: string
                    foreign_life_insurance:
                      type: array
                      description: Taxpayer, partner, or children's foreign life insurance policies held during the income year.
                      items:
                        type: object
                        properties:
                          discontinued:
                            type: boolean
                            description: Related to foreign life insurance discontinuation.
                          country_dropdown:
                            type: string
                            description: Related to foreign life insurance.
                    immovable_properties:
                      type: array
                      items:
                        type: object
                        required:
                        - uuid
                        properties:
                          street:
                            type: string
                            description: Property street address.
                          number:
                            type: string
                            description: Property number.
                          box:
                            type: string
                            description: 'Property address: Post box number (Belgian address component).'
                          postal_code:
                            type: string
                            description: Property postal code.
                          city:
                            type: string
                            description: Property city.
                          country:
                            type: string
                            description: 'Property country: Country related to the property [attribute].'
                          date_of_acquisition:
                            type: string
                            format: date
                            description: 'Property date of acquisition: Related to property purchase.'
                          non_indexed_cadastral_income:
                            type: number
                            description: Property non-indexed cadastral income.
                          date_of_sale:
                            type: string
                            format: date
                            description: Property date of sale.
                          date_of_change:
                            type: string
                            format: date
                            description: Property date of change; related to property changes.
                          new_non_indexed_cadastral_income:
                            type: number
                            description: 'Property: New non-indexed cadastral income after change.'
                          type:
                            type: string
                            description: Type of property
                          right_of_use_received:
                            type: string
                            description: 'Property [right_of_use_received]: Related to type of right of use received.'
