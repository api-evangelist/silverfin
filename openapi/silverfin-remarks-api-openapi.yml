                          type: string
                        content:
                          type: string
                        download_url:
                          type: string
                        periods:
                          type: array
                          items:
                            type: string
                        created_by:
                          type: string
                  text:
                    type: string
  /api/v4/f/{firm_id}/companies/{company_id}/remarks/{remark_id}/done:
    post:
      tags:
      - Remarks
      summary: Flag a remark as done or undone
      description: 'Flag a remark as done or undone.


        Required scope(s): `communication:write`'
      security:
      - OAuth2:
        - communication:write
      operationId: updateRemarkFlag
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                done:
                  type: boolean
                  description: Set true or false to mark the to-do as done or undone
              required:
              - done
      parameters:
      - name: Accept
        in: header
