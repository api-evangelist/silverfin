openapi: 3.2.0
info:
  title: Silverfin Remarks API
  description: This is the currently supported stable version of the Silverfin API.
  version: 1.0.0
servers:
- url: https://live.getsilverfin.com
tags:
- name: Remarks
paths:
  /api/v4/f/{firm_id}/companies/{company_id}/periods/{period_id}/remarks:
    get:
      tags:
      - Remarks
      summary: List all remarks in a specific period
      description: 'List all remarks in a specific period.


        Required scope(s): `communication:read`'
      security:
      - OAuth2:
        - communication:read
      operationId: getRemarksList
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: remark_id
                    created_at:
                      type: string
                    author:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: user_id
                        name:
                          type: string
                        username:
                          type: string
                        created_at:
                          type: string
                        email:
                          type: string
                    owner:
                      type: object
                      properties:
                        id:
                          type: integer
                        type:
                          type: string
                    followers:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          username:
                            type: string
                          created_at:
                            type: string
                          email:
                            type: string
                    sticky:
                      type: boolean
                    documents:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          file_name:
                            type: string
                          content:
                            type: string
                          download_url:
                            type: string
                          periods:
                            type: array
                            items:
                              type: string
                          created_by:
                            type: string
                    text:
                      type: string
                    html_url:
                      type: string
                    todo:
                      type: boolean
                    done_at:
                      type: string
                    done_by:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        username:
                          type: string
                        created_at:
                          type: string
                        email:
                          type: string
                    tags:
                      type: array
                      items:
                        type: string
    post:
      tags:
      - Remarks
      summary: Create a new remark in a period
      description: 'Create a new remark in a period.


        Required scope(s): `communication:write`'
      security:
      - OAuth2:
        - communication:write
      operationId: createRemark
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Remark text must not mention a non-existing user
                bot_name:
                  type: string
                  description: When left empty, the remark is posted as the user, if filled in, you post as a bot
                documents[][content]:
                  type: string
                  format: binary
                owner[id]:
                  type: integer
                  description: Identifier depending on which owner[type] was set
                owner[type]:
                  type: string
                  description: 'Value can be either one of these: Account, Company, Reconciliation, Report, Budget, Document'
                todo:
                  type: boolean
                  description: When set to true, the remark is saved as a Todo that can be completed by a user on Silverfin.
              required:
              - text
              - owner[id]
              - owner[type]
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: remark_id
                  created_at:
                    type: string
                  author:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: user_id
                      name:
                        type: string
                      username:
                        type: string
                      created_at:
                        type: string
                      email:
                        type: string
                  owner:
                    type: object
                    properties:
                      id:
                        type: integer
                      type:
                        type: string
                  followers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        username:
                          type: string
                        created_at:
                          type: string
                        email:
                          type: string
                  sticky:
                    type: boolean
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        file_name:
                          type: string
                        content:
                          type: string
                        download_url:
                          type: string
                        periods:
                          type: array
                          items:
                            type: string
                        created_by:
                          type: string
                  text:
                    type: string
                  html_url:
                    type: string
                  todo:
                    type: boolean
  /api/v4/f/{firm_id}/companies/{company_id}/remarks/{remark_id}:
    delete:
      tags:
      - Remarks
      summary: Delete a remark
      description: 'Delete a remark.


        Required scope(s):`communication:write`'
      security:
      - OAuth2:
        - communication:write
      operationId: deleteRemark
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: remark_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '204':
          description: Successful empty body response
  /api/v4/f/{firm_id}/companies/{company_id}/remarks/{remark_id}/comments:
    get:
      tags:
      - Remarks
      summary: List all comments for a specific remark
      description: 'List all comments for a specific remark.


        Required scope(s): `communication:read`'
      security:
      - OAuth2:
        - communication:read
      operationId: getCommentsListFromRemark
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: remark_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: comment_id
                    created_at:
                      type: string
                    author:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        username:
                          type: string
                        created_at:
                          type: string
                        email:
                          type: string
                    documents:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          file_name:
                            type: string
                          content:
                            type: string
                          download_url:
                            type: string
                          periods:
                            type: array
                            items:
                              type: string
                          created_by:
                            type: string
                    text:
                      type: string
    post:
      tags:
      - Remarks
      summary: Post a new comment to a specific remark
      description: 'Post a new comment to a specific remark.


        Required scope(s): `communication:write`'
      security:
      - OAuth2:
        - communication:write
      operationId: createComment
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Comment text must not mention a non-existing user
                bot_name:
                  type: string
                  description: When left empty, the remark is posted as the user, if filled in, you post as a bot
                documents[][content]:
                  type: string
                  format: binary
              required:
              - text
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: remark_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: comment_id
                  created_at:
                    type: string
                  author:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      username:
                        type: string
                      created_at:
                        type: string
                      email:
