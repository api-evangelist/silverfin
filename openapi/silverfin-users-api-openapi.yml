openapi: 3.2.0
info:
  title: Silverfin Users API
  description: This is the currently supported stable version of the Silverfin API.
  version: 1.0.0
servers:
- url: https://live.getsilverfin.com
tags:
- name: Users
paths:
  /api/v4/f/{firm_id}/users:
    get:
      tags:
      - Users
      summary: List all active users
      description: 'List all active users.


        Required scope(s): `administration:read`'
      security:
      - OAuth2:
        - administration:read
      operationId: getActiveUsersList
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 10
          maximum: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: user_id
                    name:
                      type: string
                    username:
                      type: string
                    created_at:
                      type: string
                    external:
                      type: boolean
                    email:
                      type: string
                    staff_access:
                      type: boolean
                    email_notifications_frequency:
                      type: string
                    locale:
                      type: string
    post:
      tags:
      - Users
      summary: Add a user
      description: 'Add a user.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: createUser
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                email:
                  type: string
                name:
                  type: string
                contributor:
                  type: boolean
                  description: When contributor flag is set to true, the user will be an internal user.<br> When contributor flag is set to false, the user will be an external user. <br>
                send_welcome_mail:
                  type: boolean
                  description: boolean
                locale:
                  type: string
                  description: iso 2-digit country code
                staff_access:
                  type: boolean
                  description: When staff_access flag is set to true, the user will have multi-file access enabled.<br> When staff_access is set to to false, then multi-file access will be disabled for this user.<br>
                receive_digest_emails:
                  type: boolean
                  description: boolean
                email_notifications_frequency:
                  type: string
                  description: 'Value can either be: digest, immediate, never'
                sso_connection_id:
                  type: integer
                  description: identifier of the SSO entity in Silverfin
              required:
              - email
              - name
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: user_id
                  name:
                    type: string
                  username:
                    type: string
                  created_at:
                    type: string
                  email:
                    type: string
  /api/v4/f/{firm_id}/users/inactive:
    get:
      tags:
      - Users
      summary: List all inactive users
      description: 'List all inactive users.


        Required scope(s): `administration:read`'
      security:
      - OAuth2:
        - administration:read
      operationId: getInactiveUsersList
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: user_id
                    name:
                      type: string
                    username:
                      type: string
                    created_at:
                      type: string
                    external:
                      type: boolean
                    email:
                      type: string
                    staff_access:
                      type: boolean
                    email_notification_frequency:
                      type: string
                    locale:
                      type: string
  /api/v4/f/{firm_id}/users/inactive/{user_id}/activate:
    post:
      tags:
      - Users
      summary: Activate an inactive user
      description: 'Activate an inactive user.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: updateInactiveUser
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: user_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json: {}
  /api/v4/f/{firm_id}/users/{user_id}:
    delete:
      tags:
      - Users
      summary: Put a user to inactive
      description: 'Put a user to inactive.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: deleteUser
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: user_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '204':
          description: Successful empty body response
    post:
      tags:
      - Users
      summary: Update a user
      description: 'Update a user.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: updateUser
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                locale:
                  type: string
                  description: iso 2-digit country code
                staff_access:
                  type: boolean
                  description: boolean
                receive_digest_emails:
                  type: boolean
                  description: boolean
                email_notifications_frequency:
                  type: string
                  description: 'value can either be: digest, immediate, never'
                contributor:
                  type: boolean
                  description: 'WARNING: The contributor parameter is deprecated. Talk to Customer Success to know more about it.'
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: user_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: user_id
                  name:
                    type: string
                  username:
                    type: string
                  created_at:
                    type: string
                  email:
                    type: string
  /api/v4/f/{firm_id}/users/{user_id}/companies:
    get:
      tags:
      - Users
      summary: List all companies a user has access to
      description: 'List all companies a user has access to.


        Required scope(s): `administration:read`'
      security:
      - OAuth2:
        - administration:read
      operationId: getUserCompaniesList
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: user_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: company_id
                    name:
                      type: string
    post:
      tags:
      - Users
      summary: Add a company to a user by id
      description: 'Add a company to a user by id.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: addCompanyToUserById
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                company_id:
                  type: integer
                role:
                  type: string
                  description: Value can eitber be firm, customer, external
                can_manage_users:
                  type: boolean
                  description: boolean
              required:
              - company_id
              - role
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: user_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
  /api/v4/f/{firm_id}/users/{user_id}/companies/{company_id}:
    delete:
      tags:
      - Users
      summary: Remove a company from a user by id
      description: 'Remove a company from a user by id.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: deleteCompanyFromUserById
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: user_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '204':
          description: Successful empty body response
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://live.getsilverfin.com/oauth/authorize
          tokenUrl: https://live.getsilverfin.com/oauth/token
          scopes:
            administration:read: ''
            administration:write: ''
            client_meetings:read: ''
            client_meetings:external_notes:write: ''
            communication:read: ''
            communication:write: ''
            financials:read: ''
            financials:write: ''
            financials:transactions:read: ''
            financials:transactions:write: ''
            insights:read: ''
            insights:write: ''
            workflows:read: ''
            workflows:write: ''
            permanent_documents:read: ''
            permanent_documents:write: ''
            webhooks: ''
            links: ''
            user:email: ''
            user:firm: ''
            user:profile: ''
