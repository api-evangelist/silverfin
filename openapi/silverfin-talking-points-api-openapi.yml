openapi: 3.2.0
info:
  title: Silverfin Talking Points API
  description: This is the currently supported stable version of the Silverfin API.
  version: 1.0.0
servers:
- url: https://live.getsilverfin.com
tags:
- name: Talking Points
paths:
  /api/v4/f/{firm_id}/companies/{company_id}/client_meetings/attachments:
    post:
      tags:
      - Talking Points
      summary: Upload attachment
      description: 'Upload an attachment to the current client meeting for the specified

        company. A meeting can have up to 5 attachments. Upload one file per

        request — call this endpoint repeatedly to attach multiple files.


        Supported file types: .aac .flac .mp3 .mpa .mpeg .mpga .mp4 .opus .pcm

        .wav .webm .png .jpg .jpeg .webp .txt .pdf


        Required scope: `client_meetings:external_notes:write`'
      security:
      - OAuth2:
        - client_meetings:external_notes:write
      operationId: createClientMeetingAttachment
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                bot_name:
                  type: string
                  description: 'Custom name to display as the uploader, if left empty, we use

                    the authenticated user''s name

                    '
                content:
                  type: string
                  format: binary
              required:
              - content
      parameters:
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '204':
          description: File is successfully uploaded
        '422':
          description: 'Possible reasons:<br>

            - The company has no current meeting

            - Maximum number of attachments already uploaded

            - Unsupported file type

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                example:
                  error: The company has no current meeting
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://live.getsilverfin.com/oauth/authorize
          tokenUrl: https://live.getsilverfin.com/oauth/token
          scopes:
            administration:read: ''
            administration:write: ''
            client_meetings:read: ''
            client_meetings:external_notes:write: ''
            communication:read: ''
            communication:write: ''
            financials:read: ''
            financials:write: ''
            financials:transactions:read: ''
            financials:transactions:write: ''
            insights:read: ''
            insights:write: ''
            workflows:read: ''
            workflows:write: ''
            permanent_documents:read: ''
            permanent_documents:write: ''
            webhooks: ''
            links: ''
            user:email: ''
            user:firm: ''
            user:profile: ''
