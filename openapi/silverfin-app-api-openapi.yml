openapi: 3.2.0
info:
  title: Silverfin App API
  description: This is the currently supported stable version of the Silverfin API.
  version: 1.0.0
servers:
- url: https://live.getsilverfin.com
tags:
- name: App
paths:
  /api/v4/f/{firm_id}/app/links:
    get:
      tags:
      - App
      summary: List all links for the current app & user
      description: 'List all links for the current app & user.


        Required scope(s): `links`'
      security:
      - OAuth2:
        - links
      operationId: getAppLinkByUser
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: app_link_id
                    name:
                      type: string
                      example: Go to sample app
                    name_nl:
                      type: string
                      example: Ga naar voorbeeld app
                    name_en:
                      type: string
                      example: Go to sample app
                    name_fr:
                      type: string
                      example: Aller à l'application d'exemple
                    name_da:
                      type: string
                      example: Gå til eksempel app
                    target_url:
                      type: string
                      example: https://www.sample.com/callback
                    placement:
                      type: string
                      example: reconciliation_action_menu
                    placement_options:
                      type: object
                      properties:
                        placement_option:
                          type: array
                          items:
                            type: integer
                            example: 1234
    post:
      tags:
      - App
      summary: Register an app link
      description: 'You can register a link in a specific menu in Silverfin to send a user

        from a context in Silverfin to your service or app. This can be useful

        for things like e-signing flows, data integrations and more.

        Please keep in mind that AppLinks are scoped to users, meaning only the

        user who creates them has permissions to delete them. Also, fetching the

        list of AppLinks will return those created by the user making the request.


        ## Adding AppLinks as a partner

        If you''re a partner, the placement options for marketplace reconciliation

        text and/or export files is the one you will need if you want to add a

        link for a globally managed template across firms.

        The marketplace placement options should only be used for integrations

        that are meant for the vast majority of Silverfin''s users.

        Please contact Silverfin to request the necessary ids in such cases.

        Since a marketplace reconciliation text/export file/report is globally

        managed and used across multiple firms, this means that when this option

        is used, the AppLink will be shown in the menu of all companies, and for

        every firm that uses this marketplace export file.

        For the ids in the placement options, you can provide a single id value

        or multiple values. In case you omit the value (no id added) for the

        placement options, your AppLink will be added to ALL templates of that

        placement.


        Required scope(s): `links`'
      security:
      - OAuth2:
        - links
      operationId: createAppLink
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name_nl:
                  type: string
                  description: 'Name of the link the user will see in NL (max. length 25)

                    '
                name_fr:
                  type: string
                  description: 'Name of the link the user will see in FR (max. length 25)

                    '
                name_da:
                  type: string
                  description: 'Name of the link the user will see in DA (max. length 25)

                    '
                name_en:
                  type: string
                  description: 'Name of the link the user will see in EN (max. length 25)

                    '
                target_url:
                  type: string
                  description: 'The url the user should be forwarded to when clicking

                    the link in the menu

                    '
                placement:
                  type: string
                  enum:
                  - firm_landing_action_menu
                  - workflow_action_menu
                  - export_file_action_menu
                  - period_action_menu
                  - reconciliation_action_menu
                  - permanent_text_action_menu
                  - permanent_folder_action_menu
                  - report_action_menu
                  - mapping_action_menu
                  - export_action_menu
                  description: 'The menu in which the link should be shown within Silverfin,

                    you can only add one placement per request

                    '
                placement_options[firm_workflow_ids][]:
                  type: string
                  description: 'An id representing a workflow on firm-level.

                    Use with the ''workflow_action_menu'' placement.

                    '
                placement_options[marketplace_export_file_ids][]:
                  type: string
                  description: 'An id representing an export file that is managed at the

                    global level for all partners.

                    Use with the ''export_file_action_menu''  placement.

                    '
                placement_options[export_file_ids][]:
                  type: string
                  description: 'An id representing an export file managed on firm-level.

                    Use with the ''export_file_action_menu'' placement.

                    '
                placement_options[marketplace_reconciliation_ids][]:
                  type: string
                  description: 'An id representing a reconciliation text managed on

                    partner-level.

                    Use with the ''reconciliation_action_menu'' placement.

                    '
                placement_options[reconciliation_ids][]:
                  type: string
                  description: 'An id representing either a reconciliation text within

                    a firm or the id of a reconciliation text within a company.

                    Use with the ''reconciliation_action_menu'' placement.

                    '
                client_file_type:
                  type: string
                  enum:
                  - regular
                  - analytical
                  - consolidation
                  - sole_trader
                  - personal
                  description: 'Limit the app link to only be shown in a specific client type

                    '
                open_in_new_tab:
                  type: boolean
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: app_link_id
                  name:
                    type: string
                  name_nl:
                    type: string
                  name_fr:
                    type: string
                  name_en:
                    type: string
                  name_da:
                    type: string
                  target_url:
                    type: string
                  placement:
                    type: string
                  placement_options:
                    type: object
                    properties:
                      placement_option:
                        type: array
                        items:
                          type: integer
  /api/v4/f/{firm_id}/app/links/{link_id}:
    delete:
      tags:
      - App
      summary: Destroy an app link
      description: 'Destroy an app link.


        Required scope(s): `links`'
      security:
      - OAuth2:
        - links
      operationId: deleteAppLink
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: link_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '204':
          description: Successful empty body response
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://live.getsilverfin.com/oauth/authorize
          tokenUrl: https://live.getsilverfin.com/oauth/token
          scopes:
            administration:read: ''
            administration:write: ''
            client_meetings:read: ''
            client_meetings:external_notes:write: ''
            communication:read: ''
            communication:write: ''
            financials:read: ''
            financials:write: ''
            financials:transactions:read: ''
            financials:transactions:write: ''
            insights:read: ''
            insights:write: ''
            workflows:read: ''
            workflows:write: ''
            permanent_documents:read: ''
            permanent_documents:write: ''
            webhooks: ''
            links: ''
            user:email: ''
            user:firm: ''
            user:profile: ''
