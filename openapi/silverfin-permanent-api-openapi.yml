info:
  title: Silverfin Permanent API
  description: This is the currently supported stable version of the Silverfin API.
  version: 1.0.0
servers:
- url: https://live.getsilverfin.com
tags:
- name: Permanent
paths:
  /api/v4/f/{firm_id}/companies/{company_id}/permanent_documents:
    post:
      tags:
      - Permanent
      summary: Create a permanent document
      description: 'Required scope(s): `permanent_documents:write`'
      security:
      - OAuth2:
        - permanent_documents:write
      operationId: createPermanentDocument
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                parent_id:
                  type: integer
                  description: The root folder is represented by `permanent_folder_id=0`
                  example: '0'
                name:
                  type: string
                content:
                  type: string
                  format: binary
                filename:
                  type: string
                  description: Async upload generating a presigned url
                export_file_instance_id:
                  type: integer
                  description: 'This will link the export_file_instance parameters to this permanent_document

                    '
              required:
              - parent_id
              - name
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: permanent_document_id
                  path:
                    type: array
                    items:
                      type: string
                  name:
                    type: string
                  type:
                    type: string
                  content_updated_at:
                    type: string
                  document:
                    type: object
                    properties:
                      id:
                        type: integer
                      file_name:
                        type: string
                      content:
                        type: string
                      download_url:
                        type: string
                      permanent_document_path:
                        type: array
                        items:
                          type: string
                      permanent_document_id:
                        type: integer
                      periods:
                        type: array
                        items:
                          type: string
                      created_by:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          username:
                            type: string
                          created_at:
                            type: string
                          external:
                            type: boolean
                          email:
                            type: string
                          staff_access:
                            type: boolean
                          email_notifications_frequency:
