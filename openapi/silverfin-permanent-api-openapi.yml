  /api/v4/f/{firm_id}/companies/{company_id}/permanent_folders:
    post:
      tags:
      - Permanent
      summary: Create a permanent folder
      description: 'Create a permanent folder.


        Creating or moving a permanent folder with a duplicate name will no longer

        create a new folder with numerical suffix, e.g. "Folder (1)", but instead

        yield a 422 error code.


        Required scope(s): `permanent_documents:write`'
      security:
      - OAuth2:
        - permanent_documents:write
      operationId: createPermanentFolder
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                parent_id:
                  type: integer
                  description: The root folder is represented by `permanent_folder_id=0``
                name:
                  type: string
                visibility:
                  type: string
                  description: Value can be either public or private
                  example: private
              required:
              - parent_id
              - name
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      responses:
