openapi: 3.2.0
info:
  title: Silverfin Exports API
  description: This is the currently supported stable version of the Silverfin API.
  version: 1.0.0
servers:
- url: https://live.getsilverfin.com
tags:
- name: Exports
paths:
  /api/v4/f/{firm_id}/companies/{company_id}/periods/{period_id}/export_file_instances:
    get:
      tags:
      - Exports
      summary: List all export file instances
      description: 'List all export file instances.


        Required scope(s): `financials:read`'
      security:
      - OAuth2:
        - financials:read
      operationId: getExportFileInstancesList
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: export_file_instance_id
                    file_name:
                      type: string
                    created_at:
                      type: string
                    state:
                      type: string
                    validation_errors:
                      type: array
                      items:
                        type: string
    post:
      tags:
      - Exports
      summary: Create a new export file instance
      description: 'Export file instances are created based on a an export file through the

        export_file_id.


        They are created asynchronously, so when you create an export file

        instance, you get back the id and the current state, which will be

        pending on the first request.


        You can then poll the detail page of an export file instance until the

        state changes to created. When the state is created, you can fetch the

        content.


        Required scope(s): `financials:write`'
      security:
      - OAuth2:
        - financials:write
      operationId: createExportFileInstance
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                export_file_id:
                  type: string
              required:
              - export_file_id
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: export_file_instance_id
                  file_name:
                    type: string
                  created_at:
                    type: string
                  state:
                    type: string
                  validation_errors:
                    type: array
                    items:
                      type: string
  /api/v4/f/{firm_id}/companies/{company_id}/periods/{period_id}/export_file_instances/{export_file_instance_id}:
    get:
      tags:
      - Exports
      summary: Get content of an export file instance
      description: 'Get content of an export file instance.


        Required scope(s): `financials:read`'
      security:
      - OAuth2:
        - financials:read
      operationId: getExportFileInstanceContent
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      - name: export_file_instance_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: export_file_instance_id
                  file_name:
                    type: string
                  created_at:
                    type: string
                  state:
                    type: string
                  content:
                    type: string
                  content_url:
                    type: string
                  created_by:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: user_id
                      name:
                        type: string
                      username:
                        type: string
                      created_at:
                        type: string
                      email:
                        type: string
                  sign_markers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: sign_marker_id
                        name:
                          type: string
                        email:
                          type: string
                        phone:
                          type: string
                        role:
                          type: string
                        on_behalf_of:
                          type: string
                        first_name:
                          type: string
                        last_name:
                          type: string
                        action:
                          type: string
                        deadline_date:
                          type: string
                  results:
                    type: object
                  validation_errors:
                    type: array
                    items:
                      type: string
  /api/v4/f/{firm_id}/companies/{company_id}/periods/{period_id}/export_files:
    get:
      tags:
      - Exports
      summary: List all export files
      description: 'List all export files.


        Required scope(s): `financials:read`'
      security:
      - OAuth2:
        - financials:read
      operationId: getExportFilesList
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: export_file_id
                    marketplace_template_id:
                      type: integer
                    name:
                      type: string
  /api/v4/f/{firm_id}/companies/{company_id}/periods/{period_id}/export_pdf_instances:
    get:
      tags:
      - Exports
      summary: List all export pdf instances
      description: 'List all export pdf instances.


        Required scope(s): `financials:read`'
      security:
      - OAuth2:
        - financials:read
      operationId: getExportPdfInstancesList
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
      - Exports
      summary: Create a new export pdf instance
      description: 'Export PDF instances are created based on a template passed through the

        export_pdf_id. They are created asynchronously, so when you create an

        export PDF instance, you get back the id and the current state, which

        will be pending on the first request.

        You can then poll the detail page of an export pdf instance until the

        state changes to created or error.


        When the state is created, you will get a download_url that gives you a

        direct link to the actual pdf file (this url expires after some time).


        Required scope(s): `financials:write`'
      security:
      - OAuth2:
        - financials:write
      operationId: createExportPdfInstance
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                export_pdf_id:
                  type: integer
                title:
                  type: string
              required:
              - export_pdf_id
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: export_pdf_instance_id
                  created_at:
                    type: string
                  export_pdf_id:
                    type: integer
                  state:
                    type: string
                  title:
                    type: string
                  sign_markers:
                    type: object
                    properties:
                      id:
                        type: string
                        description: sign_marker_id
                      name:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                      role:
                        type: string
                      on_behalf_of:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      action:
                        type: string
                      deadline_date:
                        type: string
                  results:
                    type: object
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: user_id
                      name:
                        type: string
                      username:
                        type: string
                      created_at:
                        type: string
                      email:
                        type: string
