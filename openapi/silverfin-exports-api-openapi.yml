      summary: Move an export pdf instance to the documents
      description: 'Move an export pdf instance to the documents.


        Required scope(s): `financials:write`'
      security:
      - OAuth2:
        - financials:write
      operationId: moveExportPdfInstanceToDocuments
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                parent_id:
                  type: integer
                  description: This is the parent_id of the permanent_folder you want to move this export to. Use parent_id 0 to move to the root folder
                  example: '0'
              required:
