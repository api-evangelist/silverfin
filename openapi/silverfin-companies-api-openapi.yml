                  organisation_form:
                    type: string
                  country:
                    type: string
                  city:
                    type: string
                  street:
                    type: string
                  file_code:
                    type: string
                  company_type:
                    type: string
                  periods_per_year:
                    type: integer
                  sync_reference:
                    type: string
                  accountancy_synchronisation_reference:
                    type: string
                  accountancy_synchronisation_entity_id:
                    type: integer
                  accountancy_synchronisation_entity_type:
                    type: string
                  account_mapping_list_id:
                    type: integer
                  administration_synchronisation_reference:
                    type: string
                  administration_synchronisation_entity_id:
                    type: integer
                  company_template_id:
                    type: integer
                  folder_name:
                    type: string
                  vat:
                    type: string
                  visible_for_contributors:
                    type: boolean
                  currency:
                    type: string
                  group_ids:
                    type: array
                    items:
                      type: integer
                  year_end:
                    type: string
                  first_name:
                    type: string
                  last_name:
                    type: string
                  national_insurance_number:
                    type: string
