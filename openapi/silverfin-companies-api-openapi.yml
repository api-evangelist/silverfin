  /api/v4/f/{firm_id}/companies/{company_id}/all_people:
    get:
      tags:
      - Companies
      summary: Get the people of a company
      description: 'Get the people of a company.


        Required scope(s): `administration:read`'
      security:
      - OAuth2:
        - administration:read
      operationId: getAllPeople
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 10
          maximum: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    shareholder:
                      type: boolean
                    director:
                      type: boolean
    post:
      tags:
      - Companies
      summary: Update the people of a company
      description: 'Update the people of a company.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: updateAllPeople
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                people[][name]:
                  type: string
                people[][email]:
                  type: string
                people[][phone]:
                  type: string
                people[][amount_of_votes]:
                  type: integer
                people[][amount_of_shares]:
                  type: integer
                people[][address_1]:
                  type: string
                people[][address_2]:
                  type: string
                people[][external_id]:
                  type: string
                people[][role]:
                  type: string
                people[][statutory]:
                  type: boolean
                people[][shareholder]:
                  type: boolean
                people[][director]:
                  type: boolean
                people[][director_start_date]:
                  type: string
                  format: date
                people[][director_end_date]:
                  type: string
                  format: date
                people[][custom][key]:
                  type: string
                people[][custom][value]:
                  type: string
              required:
              - people[][external_id]
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    shareholder:
                      type: boolean
                    director:
                      type: boolean
  /api/v4/f/{firm_id}/companies/{company_id}/custom:
    get:
      tags:
      - Companies
      summary: Get custom company parameters
      description: 'Get custom company parameters.


        Required scope(s): `administration:read``'
      security:
      - OAuth2:
        - administration:read
      operationId: getCompanyCustomProperties
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    namespace:
                      type: string
                    key:
                      type: string
                    value:
                      type: string
                    owner:
                      type: object
                      properties:
                        id:
                          type: integer
                        type:
                          type: string
                    documents:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          file_name:
                            type: string
                          content:
                            type: string
                          download_url:
                            type: string
                          periods:
                            type: array
                            items:
                              type: string
                          created_by:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              username:
                                type: string
                              created_at:
                                type: string
                              email:
                                type: string
                    updated_by_id:
                      type: integer
    post:
      tags:
      - Companies
      summary: Post a custom property to a company
      description: 'Post a custom property to a company.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: createCompanyCustomProperty
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                namespace:
                  type: string
                key:
                  type: string
                value:
                  type: string
                  description: 'The value can be one of the following types: boolean, double, integer, object, string'
              required:
              - namespace
              - key
              - value
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
