openapi: 3.2.0
info:
  title: Silverfin Companies API
  description: This is the currently supported stable version of the Silverfin API.
  version: 1.0.0
servers:
- url: https://live.getsilverfin.com
tags:
- name: Companies
paths:
  /api/v4/f/{firm_id}/companies:
    get:
      tags:
      - Companies
      summary: List all companies
      description: 'List all companies.


        Required scope(s): `administration:read`'
      security:
      - OAuth2:
        - administration:read
      operationId: getCompanies
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: file_code
        in: query
        schema:
          type: string
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: company_id
                    name:
                      type: string
                    created_at:
                      type: string
                    organisation_form:
                      type: string
                    country:
                      type: string
                    city:
                      type: string
                    street:
                      type: string
                    file_code:
                      type: string
                    company_type:
                      type: string
                    periods_per_year:
                      type: integer
                    sync_reference:
                      type: string
                    accountancy_synchronisation_reference:
                      type: string
                    accountancy_synchronisation_entity_id:
                      type: integer
                    accountancy_synchronisation_entity_type:
                      type: string
                    account_mapping_list_id:
                      type: integer
                    administration_synchronisation_reference:
                      type: string
                    administration_synchronisation_entity_id:
                      type: integer
                    company_template_id:
                      type: integer
                    folder_name:
                      type: string
                    vat:
                      type: string
                    visible_for_contributors:
                      type: boolean
                    currency:
                      type: string
                    group_ids:
                      type: array
                      items:
                        type: integer
                    year_end:
                      type: string
                    first_name:
                      type: string
                    last_name:
                      type: string
                    national_insurance_number:
                      type: string
    post:
      tags:
      - Companies
      summary: Add a company
      description: 'Add a company.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: createCompany
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                company_type:
                  type: string
                  description: 'Can either be: regular, analytical, consolidation, sole_trader'
                first_name:
                  type: string
                  description: required ONLY for personal files
                last_name:
                  type: string
                  description: required ONLY for personal files
                national_insurance_number:
                  type: string
                name:
                  type: string
                  description: The company's name.
                periods_per_year:
                  type: integer
                  description: Can either be 1, 4, 12 (monthly, quarterly, yearly)
                accountancy_synchronisation_entity_id:
                  type: integer
                accountancy_synchronisation_reference:
                  type: string
                account_mapping_list_id:
                  type: integer
                administration_synchronisation_entity_id:
                  type: integer
                administration_synchronisation_reference:
                  type: string
                year_end:
                  type: string
                  format: date
                organisation_form:
                  type: string
                file_code:
                  type: string
                company_template_id:
                  type: integer
                  description: "If the ID is given, the company will use the company template identified by that ID. <br /> Otherwise:\n  <ul>\n    <li>For regular companies, it will use the firm's default company template.</li>\n    <li>For sole trader companies, it will use the firm's default sole trader template.</li>\n    <li>For personal files (only considers active company templates - \"can be manually added\"), it will find a company template according to the following rules, in order:\n      <ul>\n        <li>First personal company template having the Silverfin Personal Income Tax workflow as default</li>\n        <li>First personal company template having the Silverfin Personal Income Tax workflow</li>\n        <li>First personal company template</li>\n      </ul>\n    </li>\n  </ul>"
                visible_for_contributors:
                  type: boolean
                vat_identifier:
                  type: string
                  deprecated: true
                  description: Please use `registration_number` or `vat_number` instead
                registration_number:
                  type: string
                vat_number:
                  type: string
                street:
                  type: string
                city:
                  type: string
                country:
                  type: string
                currency:
                  type: string
                custom[][namespace]:
                  type: string
                custom[][key]:
                  type: string
                custom[][value]:
                  type: string
              required:
              - year_end
              - name
              - periods_per_year
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: company_id
                  name:
                    type: string
                  created_at:
                    type: string
                  organisation_form:
                    type: string
                  country:
                    type: string
                  city:
                    type: string
                  street:
                    type: string
                  file_code:
                    type: string
                  company_type:
                    type: string
                  periods_per_year:
                    type: integer
                  sync_reference:
                    type: string
                  accountancy_synchronisation_reference:
                    type: string
                  accountancy_synchronisation_entity_id:
                    type: integer
                  accountancy_synchronisation_entity_type:
                    type: string
                  account_mapping_list_id:
                    type: integer
                  administration_synchronisation_reference:
                    type: string
                  administration_synchronisation_entity_id:
                    type: integer
                  company_template_id:
                    type: integer
                  folder_name:
                    type: string
                  vat:
                    type: string
                  visible_for_contributors:
                    type: boolean
                  currency:
                    type: string
                  group_ids:
                    type: array
                    items:
                      type: integer
                  year_end:
                    type: string
                  first_name:
                    type: string
                  last_name:
                    type: string
                  national_insurance_number:
                    type: string
