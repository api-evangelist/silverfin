        example: '{{client_id}}'
      - name: redirect_uri
        in: query
        schema:
          type: string
        example: '{{callback_url}}'
      - name: response_type
        in: query
        schema:
          type: string
        example: code
      - name: scope
        in: query
        schema:
          type: string
        example: user:profile user:email webhooks administration:read administration:write permanent_documents:read permanent_documents:write communication:read communication:write financials:read financials:write financials:transactions:read financials:transactions:write links workflows:read
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
