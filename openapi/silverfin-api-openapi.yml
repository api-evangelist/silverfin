        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      - name: account_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: account_id
                      name:
                        type: string
                      number:
                        type: string
                      account_type:
                        type: string
                  account_reconciliation_template:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: account_reconciliation_template_id
                  value:
                    type: string
                  starred:
                    type: boolean
