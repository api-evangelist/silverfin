      - OAuth2:
        - administration:read
      operationId: getAccountTemplatesList
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
