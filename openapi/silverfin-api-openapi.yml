      description: 'Remove a shared part from an account template. <br>

        <b>Required scope(s):</b> `administration:write`

        '
      security:
      - OAuth2:
        - administration:write
      operationId: deleteSharedPartfromAccountTemplate
      parameters:
      - name: Accept
