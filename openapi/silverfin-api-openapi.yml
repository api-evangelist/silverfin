      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: Identifier of the account template
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportFileTemplate'
    post:
      tags:
      - Templates
      summary: Update an existing account template
      description: 'Update an existing account template. <br>

        <b>Required scope(s):</b> `administration:write`

        '
      security:
      - OAuth2:
        - administration:write
      operationId: updateAccountTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountTemplateUpdateRequest'
      parameters:
      - name: Accept
        in: header
