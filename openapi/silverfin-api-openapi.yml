          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: Identifier of the account template
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTemplateUpdateRequest'
  /api/v4/f/{firm_id}/accountancy_synchronisation_entities:
    get:
      tags:
      - Accountancy Synchronisation Entities
      summary: List all accountancy synchronisation entities
      description: 'List all accountancy synchronisation entities. <br>

        <b>Required scope(s):</b> `administration:read`

        '
      security:
      - OAuth2:
        - administration:read
      operationId: getAccountancySyncEntities
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: sync_entity_id
                    name:
                      type: string
                    sync_type:
                      type: string
  /api/v4/f/{firm_id}/app/links:
    get:
      tags:
      - App
      summary: List all links for the current app & user
      description: 'List all links for the current app & user. <br>

        <b>Required scope(s):</b> `links`

        '
      security:
      - OAuth2:
        - links
      operationId: getAppLinkByUser
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: app_link_id
                    name:
                      type: string
                      example: Go to sample app
                    name_nl:
                      type: string
                      example: Ga naar voorbeeld app
                    name_en:
                      type: string
                      example: Go to sample app
                    name_fr:
                      type: string
                      example: Aller à l'application d'exemple
                    name_da:
                      type: string
                      example: Gå til eksempel app
                    target_url:
                      type: string
                      example: https://www.sample.com/callback
                    placement:
                      type: string
                      example: reconciliation_action_menu
                    placement_options:
                      type: object
                      properties:
                        placement_option:
                          type: array
                          items:
                            type: integer
                            example: 1234
    post:
      tags:
      - App
      summary: Register an app link
      description: 'You can register a link in a specific menu in Silverfin to send a user

        from a context in Silverfin to your service or app. This can be useful

        for things like e-signing flows, data integrations and more.

        Please keep in mind that AppLinks are scoped to users, meaning only the

        user who creates them has permissions to delete them. Also, fetching the

        list of AppLinks will return those created by the user making the request.

        <br>

        ## Adding AppLinks as a partner

        If you''re a partner, the placement options for marketplace reconciliation

        text and/or export files is the one you will need if you want to add a

        link for a globally managed template across firms.

        The marketplace placement options should only be used for integrations

        that are meant for the vast majority of Silverfin''s users.

        Please contact Silverfin to request the necessary ids in such cases.

        Since a marketplace reconciliation text/export file/report is globally

        managed and used across multiple firms, this means that when this option

        is used, the AppLink will be shown in the menu of all companies, and for

        every firm that uses this marketplace export file.

        For the ids in the placement options, you can provide a single id value

        or multiple values. In case you omit the value (no id added) for the

        placement options, your AppLink will be added to ALL templates of that

        placement. <br>

        <b>Required scope(s):</b> `links`

        '
      security:
      - OAuth2:
        - links
      operationId: createAppLink
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name_nl:
                  type: string
                  description: 'Name of the link the user will see in NL (max. length 25)

                    '
                name_fr:
                  type: string
                  description: 'Name of the link the user will see in FR (max. length 25)

                    '
                name_da:
                  type: string
                  description: 'Name of the link the user will see in DA (max. length 25)

                    '
                name_en:
                  type: string
                  description: 'Name of the link the user will see in EN (max. length 25)

                    '
                target_url:
                  type: string
                  description: 'The url the user should be forwarded to when clicking

                    the link in the menu

                    '
                placement:
                  type: string
                  enum:
                  - firm_landing_action_menu
                  - workflow_action_menu
                  - export_file_action_menu
                  - period_action_menu
                  - reconciliation_action_menu
                  - permanent_text_action_menu
                  - permanent_folder_action_menu
                  - report_action_menu
                  - mapping_action_menu
                  - export_action_menu
                  description: 'The menu in which the link should be shown within Silverfin,

                    you can only add one placement per request

                    '
                placement_options[firm_workflow_ids][]:
                  type: string
                  description: 'An id representing a workflow on firm-level.

                    Use with the ''workflow_action_menu'' placement.

                    '
                placement_options[marketplace_export_file_ids][]:
                  type: string
                  description: 'An id representing an export file that is managed at the

                    global level for all partners.

                    Use with the ''export_file_action_menu''  placement.

                    '
                placement_options[export_file_ids][]:
                  type: string
                  description: 'An id representing an export file managed on firm-level.

                    Use with the ''export_file_action_menu'' placement.

                    '
                placement_options[marketplace_reconciliation_ids][]:
                  type: string
                  description: 'An id representing a reconciliation text managed on

                    partner-level.

                    Use with the ''reconciliation_action_menu'' placement.

                    '
                placement_options[reconciliation_ids][]:
                  type: string
                  description: 'An id representing either a reconciliation text within

                    a firm or the id of a reconciliation text within a company.

                    Use with the ''reconciliation_action_menu'' placement.

                    '
                client_file_type:
                  type: string
                  enum:
                  - regular
                  - analytical
                  - consolidation
                  - sole_trader
                  - personal
                  description: 'Limit the app link to only be shown in a specific client type

                    '
                open_in_new_tab:
                  type: boolean
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: app_link_id
                  name:
                    type: string
                  name_nl:
                    type: string
                  name_fr:
                    type: string
                  name_en:
                    type: string
                  name_da:
                    type: string
                  target_url:
                    type: string
                  placement:
                    type: string
                  placement_options:
                    type: object
                    properties:
                      placement_option:
                        type: array
                        items:
                          type: integer
  /api/v4/f/{firm_id}/app/links/{link_id}:
    delete:
      tags:
      - App
      summary: Destroy an app link
      description: 'Destroy an app link.<br>

        <b>Required scope(s):</b> `links`

        '
      security:
      - OAuth2:
        - links
      operationId: deleteAppLink
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: link_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '204':
          description: Successful empty body response
  /api/v4/f/{firm_id}/companies:
    get:
      tags:
      - Companies
      summary: List all companies
      description: 'List all companies. <br>

        <b>Required scope(s):</b> `administration:read`

        '
      security:
      - OAuth2:
        - administration:read
      operationId: getCompanies
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: file_code
        in: query
        schema:
          type: string
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: company_id
                    name:
                      type: string
                    created_at:
                      type: string
                    organisation_form:
                      type: string
                    country:
                      type: string
                    city:
                      type: string
                    street:
                      type: string
                    file_code:
                      type: string
                    company_type:
                      type: string
                    periods_per_year:
                      type: integer
                    sync_reference:
                      type: string
                    accountancy_synchronisation_reference:
                      type: string
                    accountancy_synchronisation_entity_id:
                      type: integer
                    accountancy_synchronisation_entity_type:
                      type: string
                    account_mapping_list_id:
                      type: integer
                    administration_synchronisation_reference:
                      type: string
                    administration_synchronisation_entity_id:
                      type: integer
                    company_template_id:
                      type: integer
                    folder_name:
                      type: string
                    vat:
                      type: string
                    visible_for_contributors:
                      type: boolean
                    currency:
                      type: string
                    group_ids:
                      type: array
                      items:
                        type: integer
                    year_end:
                      type: string
                    first_name:
                      type: string
                    last_name:
                      type: string
                    national_insurance_number:
                      type: string
    post:
      tags:
      - Companies
      summary: Add a company
      description: 'Add a company. <br>

        <b>Required scope(s):</b> `administration:write`

        '
      security:
      - OAuth2:
        - administration:write
      operationId: createCompany
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                company_type:
                  type: string
                  description: 'Can either be: regular, analytical, consolidation, sole_trader'
                first_name:
                  type: string
                  description: required ONLY for personal files
                last_name:
                  type: string
                  description: required ONLY for personal files
                national_insurance_number:
                  type: string
                name:
                  type: string
                  description: The company's name.
                periods_per_year:
                  type: integer
                  description: Can either be 1, 4, 12 (monthly, quarterly, yearly)
                accountancy_synchronisation_entity_id:
                  type: integer
                accountancy_synchronisation_reference:
                  type: string
                account_mapping_list_id:
                  type: integer
                administration_synchronisation_entity_id:
                  type: integer
                administration_synchronisation_reference:
                  type: string
                year_end:
                  type: string
                  format: date
                organisation_form:
                  type: string
                file_code:
                  type: string
                company_template_id:
                  type: integer
                  description: "If the ID is given, the company will use the company template identified by that ID. <br /> Otherwise:\n  <ul>\n    <li>For regular companies, it will use the firm's default company template.</li>\n    <li>For sole trader companies, it will use the firm's default sole trader template.</li>\n    <li>For personal files (only considers active company templates - \"can be manually added\"), it will find a company template according to the following rules, in order:\n      <ul>\n        <li>First personal company template having the Silverfin Personal Income Tax workflow as default</li>\n        <li>First personal company template having the Silverfin Personal Income Tax workflow</li>\n        <li>First personal company template</li>\n      </ul>\n    </li>\n  </ul>"
                visible_for_contributors:
                  type: boolean
                vat_identifier:
