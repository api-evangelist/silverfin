  /api/v4/f/{firm_id}/segments/{id}/results:
    get:
      tags:
      - Insights
      summary: Fetch the results of the latest run of an Insights segment
      description: "Returns the results of the authenticated user's latest run of the segment for\nthe companies that user can access in Silverfin. This endpoint never starts a\nsegment run.\n\nWhile a run is in progress a 202 with its progress is returned; the previous\nrun's results are never served as current. When no generated results exist (or\nthey expired), the response will return a 404 status code. You can start a new run\nvia `POST /segments/{id}/runs`.\n\n### The pending payload\n\nWhile the run is in progress, the 202 response indicates current progress instead\nof results:\n\n```json\n{\n  \"status\": \"pending\",\n  \"request_ref\": \"9f8c0a2e-1d3b-4f5a-8c7e-2b6d4a1f0e93\",\n  \"started_at\": \"2026-08-04T09:12:44.000+02:00\",\n  \"finished_at\": null,\n  \"progress\": {\n    \"processed_companies\": 128\n  },\n  \"message\": \"The segment run is not ready yet. Poll this endpoint until it finishes.\"\n}\n```\n\n| field | description |\n| ----- | ----------- |\n| **status**\
        \ | always `pending` here; `pending` and `finished` are the only values this field ever takes\n| **request_ref** | reference of the pending run\n| **started_at** | when the run was created (ISO 8601)\n| **finished_at** | always `null` while the run is pending\n| **progress** | `processed_companies`: how many companies the run has processed so far. Informational only: a run with slow filters evaluates companies in two passes and can count a company in both, so it is not a fraction of a known total\n| **message** | a human-readable hint. Of the pending payloads, only this endpoint's 202 carries it\n\n`POST /segments/{id}/runs` answers with this same payload, without `message`,\nwhenever it reports a pending run. When the latest run finished less than\n12 hours ago, it answers with that finished run's `status`, `request_ref`,\n`started_at` and `finished_at`, plus `next_run_allowed_at` and a `message`\nthat points to this endpoint.\n\n### The finished payload\n\nA finished run of a segment\
        \ with two columns, one client file matching:\n\n```json\n{\n  \"status\": \"finished\",\n  \"request_ref\": \"9f8c0a2e-1d3b-4f5a-8c7e-2b6d4a1f0e93\",\n  \"started_at\": \"2026-08-04T09:12:44.000+02:00\",\n  \"finished_at\": \"2026-08-04T09:13:07.000+02:00\",\n  \"period_selection\": {\n    \"type\": \"financial_year\",\n    \"date\": \"2025-12-31\"\n  },\n  \"columns\": [\n    {\n      \"uuid\": \"1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d\",\n      \"type\": \"BookyearEnd\",\n      \"name\": \"Book year end\",\n      \"settings\": {\n        \"comparison_mode\": \"exactly\",\n        \"end_date\": \"2025-12-31\"\n      }\n    },\n    {\n      \"uuid\": \"2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e\",\n      \"type\": \"Todos\",\n      \"name\": \"To-dos\",\n      \"settings\": {\n        \"status\": \"open\"\n      }\n    }\n  ],\n  \"matches\": [\n    {\n      \"company_id\": 918273,\n      \"company_name\": \"Acme NV\",\n      \"period_id\": 5544332,\n      \"period_end_date\": \"2025-12-31\"\
        ,\n      \"values\": {\n        \"1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d\": {\n          \"formatted_value\": \"31/12/2025\",\n          \"sort_value\": \"2025-12-31\"\n        },\n        \"2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e\": {\n          \"formatted_value\": {\n            \"status\": \"partially_done\",\n            \"completed\": 3,\n            \"total\": 7\n          },\n          \"sort_value\": 4\n        }\n      }\n    }\n  ],\n  \"pagination\": {\n    \"page\": 1,\n    \"per_page\": 200,\n    \"total_matches\": 128,\n    \"total_pages\": 1\n  },\n  \"non_match_count\": 41\n}\n```\n\n### Envelope\n\n| field | description |\n| ----- | ----------- |\n| **status** | `finished` for a results payload, `pending` on the pending payload above; these are the only two values\n| **request_ref** | reference of the run the results come from\n| **started_at** | when the run was created (ISO 8601)\n| **finished_at** | when the segment run finished (ISO 8601)\n| **period_selection**\
        \ | How the run picked each company's period:<ul><li><strong>financial_year</strong> or <strong>accounting_period</strong>: includes <strong>date</strong>, which can be null</li><li><strong>active_period</strong> or <strong>completed_period</strong>: includes <strong>locking_type</strong>, either <strong>locked</strong> or <strong>permanently_locked</strong></li><li>A segment saved without a period selection reports the applied default: <strong>financial_year</strong> with a null date</li></ul>\n| **columns** | one entry per column of the run, in column order\n| **matches** | the companies that matched, one page at a time, ordered by company name\n| **pagination** | `page`, `per_page`, `total_matches`, `total_pages`; the `Total` and `Per-Page` response headers carry the same totals\n| **non_match_count** | how many of your accessible companies did not match\n\nTimestamps are ISO 8601 with the server's UTC offset (e.g. `+02:00`).\n\n### columns\n\n| field | description |\n| -----\
        \ | ----------- |\n| **uuid** | the key this column's value appears under in each match's `values`\n| **type** | the filter type, e.g. `WorkflowProgress` (see [values by filter type](#values-by-filter-type))\n| **name** | the column's display name, in the profile language of the user the run belongs to; an empty string for a column that was never named\n| **settings** | the filter's configuration: what the column filters on\n\n`type`, `name` and `settings` are all `null` on the rare run column that no\nlonger maps to one of the segment's filters.\n\n**`uuid` is not an identifier, and must not be treated as stable.** Its only job\nis to tie a column to its values inside one response. It is stored with the run,\nso fetching the same finished run again returns the same uuids, but that is a\nconsequence of reading one cached result twice, not a guarantee. A new run\ngenerates new ones, and the same column then comes back under a different `uuid`.\nSo read `columns` from the same payload\
        \ you read `matches` from and correlate\nthrough it, rather than persisting a uuid or comparing uuids across responses.\n`columns` follows the segment's filter order if you need to recognise a column\nfrom one run to the next; `type` repeats when a segment has two columns of the\nsame kind, and `name` follows the run user's language.\n\n### columns.settings\n\nEach `columns` item contains `settings`, which carries the filter's configuration\nas Silverfin stores it, so you can tell what a column actually filtered on.\nIts keys depend on the column's `type`, and it mirrors internal configuration rather\nthan a payload designed for the API:\ntreat it as informational, expect keys you do not recognise, and do not rely on\nany single key being present.\n\nMost types share a small vocabulary:\n\n- `comparison_mode`: how the column matched, on all but a couple of types. One of\n  `equal`, `not_equal`, `less_than`, `greater_than`, `less_than_or_equal`,\n  `greater_than_or_equal`, `contains`,\
        \ `exactly`, `is`, `is not`, `true`, `false`,\n  `up to status`, `from status`, `current-user`, `user`, `show-all`, plus\n  `partially_starred` on `TemplateStarring` columns. Match these\n  exactly: the values are not uniformly formatted, and some carry a space or a\n  hyphen rather than an underscore\n- `comparison_value`: the value matched against, for the modes that need one\n- `filter_data_type`: which attribute the column reads, on the types that cover\n  several (`CompanyData`, `SubmissionData`)\n- `filter_data_value`: the selected value the column matched on\n\nSome types point at other Silverfin records, which you can resolve through the\ncorresponding API resources:\n\n- `firm_workflow_id`: the workflow the column reports on. Absent or `null`\n  means each client file's own default workflow (except on `WorkflowUsage`,\n  which always names a specific workflow)\n- `reconciliation_text_id`: the reconciliation template\n- `account_detail_template_id`: the account detail template\
        \ (`TemplateStarring`)\n- `workflow_status_id`: the workflow status (`WorkflowStatus`)\n\n**Partner references.** A segment created from a recommended (partner) template\nholds firm-agnostic references, which are translated to your firm's ids before the\nresponse is built, so you normally see the firm keys above. When your firm has\nnot imported the referenced template the partner reference survives instead\n(`partner_workflow_id`, `partner_reconciliation_text_id` or\n`partner_account_detail_template_id`), usually alongside a matching `..._name`\nkey carrying the template's name so the column can still be labelled.\n\n### matches\n\n| field | description |\n| ----- | ----------- |\n| **company_id** | id of the client file\n| **company_name** | name of the client file\n| **period_id** | id of the period the run evaluated for this company\n| **period_end_date** | end date of that period (ISO 8601)\n| **values** | an object keyed by column `uuid`\n\nEvery entry of `values` carries `formatted_value`\
        \ and `sort_value` (plus\n`filter_error` when the value errored), and is `null` when the run holds no\nvalue for that column:\n\n| field | description |\n| ----- | ----------- |\n| **formatted_value** | the value as Silverfin displays it; see [values by filter type](#values-by-filter-type)\n| **sort_value** | a sortable representation of the same value\n| **filter_error** | only present when the filter could not be evaluated for this company; the message says why, and `formatted_value` and `sort_value` then repeat that message instead of a value\n\n**`formatted_value` is display output, not data.** It is built for the Silverfin\ninterface and translated into the profile language of the user the run belongs\nto, like `columns[].name`; the `Accept-Language` header does not affect it. It\ncarries display formatting (`\"Archived - 45%\"`, `\"Shared on 04/08/2026\"`,\nthousands separators). Do not parse it: its wording can change with an\ninterface change.\nUse `sort_value`, or the object\
        \ fields below, when you need a stable value.\nObject-shaped values can gain fields in a later version, so ignore fields you\ndo not know.\n\n### Values by filter type\n\n<table>\n  <thead>\n    <tr>\n      <th>type</th>\n      <th>formatted_value</th>\n      <th>sort_value</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>BookyearEnd</strong></td>\n      <td>Book year end as dd/mm/yyyy</td>\n      <td>The same date in ISO 8601 format</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": \"31/12/2025\",&#10;  \"sort_value\": \"2025-12-31\"&#10;}</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>CompanyData</strong></td>\n      <td>Depends on settings.filter_data_type: a template, sync entity or mapping list name; mm/yyyy for a date; a translated label for reporting frequency, client type and staff visibility; or the stored attribute for plain columns</td>\n      <td>Usually the\
        \ same string; reporting frequency is numeric periods per year, creation date is an ISO 8601 timestamp, and last period is an ISO 8601 date</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": \"Limited company\",&#10;  \"sort_value\": \"Limited company\"&#10;}</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>CompanyGroups</strong></td>\n      <td>Visible groups, comma separated; an empty string when none</td>\n      <td>The same string</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": \"Retail, Flanders\",&#10;  \"sort_value\": \"Retail, Flanders\"&#10;}</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>FollowCompanies</strong></td>\n      <td>Follower names, comma separated in show-all mode and a single name in user or current-user mode; null in show-all mode when nobody follows</td>\n      <td>The same\
        \ string or null</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": \"Marie Dubois, Jan Peeters\",&#10;  \"sort_value\": \"Marie Dubois, Jan Peeters\"&#10;}</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>Formula</strong></td>\n      <td>Currency-formatted result; null for personal client files</td>\n      <td>Decimal string, including for personal client files</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": \"1.284.500,00\",&#10;  \"sort_value\": \"1284500.0\"&#10;}</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>PeriodLocked</strong></td>\n      <td>Object described in <a href=\"#periodlocked-shape\">PeriodLocked shape</a></td>\n      <td>The status string</td>\n    </tr>\n    <tr>\n      <td><strong>PreparationAndReview</strong></td>\n      <td>One of the objects described in <a href=\"#preparationandreview-shapes\"\
        >PreparationAndReview shapes</a></td>\n      <td>Completion percentage for a workflow, an ISO 8601 timestamp for one template, or null</td>\n    </tr>\n    <tr>\n      <td><strong>ReconciliationResult</strong></td>\n      <td>A translated Yes/No, dd/mm/yyyy date, currency-formatted number or stored text; a missing value is an empty string, or \"0,00\" in numeric comparison mode</td>\n      <td>ISO 8601 date, decimal string for numeric modes, or string</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": \"12.500,00\",&#10;  \"sort_value\": \"12500.0\"&#10;}</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>SubmissionData</strong></td>\n      <td>Due date as dd/mm/yyyy, or title-cased submission status; null in show-all mode when the client file has no submission of that type, or the submission has no due date</td>\n      <td>ISO 8601 due date, or one of due, overdue, failed, pending, accepted and\
        \ rejected; null in the same two cases</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": \"30/09/2026\",&#10;  \"sort_value\": \"2026-09-30\"&#10;}</code></pre><pre><code class=\"language-json\">{&#10;  \"formatted_value\": \"Accepted\",&#10;  \"sort_value\": \"accepted\"&#10;}</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>SyncsInformation</strong></td>\n      <td>String, null, or a sync-status object described in <a href=\"#syncsinformation-shapes\">SyncsInformation shapes</a></td>\n      <td>The string or status</td>\n    </tr>\n    <tr>\n      <td><strong>TemplateStarring</strong></td>\n      <td>Accounts object, reconciliation object, or an empty string when the column does not apply</td>\n      <td>Starred count or flag; see <a href=\"#templatestarring-shapes\">TemplateStarring shapes</a></td>\n    </tr>\n    <tr>\n      <td><strong>Todos</strong></td>\n      <td>Object described in\
        \ <a href=\"#todos-shape\">Todos shape</a></td>\n      <td>Number of open to-dos</td>\n    </tr>\n    <tr>\n      <td><strong>WorkflowProgress</strong></td>\n      <td>Percentage, optionally prefixed with translated \"Archived\"; \"n/a\" when there is no progress; empty string when there is no workflow</td>\n      <td>Number from 0 to 100, or null for the no-progress and no-workflow cases</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": \"45%\",&#10;  \"sort_value\": 45&#10;}</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>WorkflowSharingStatus</strong></td>\n      <td>Translated \"Shared on dd/mm/yyyy\", or \"Not shared\"</td>\n      <td>ISO 8601 share timestamp, or null</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": \"Shared on 04/08/2026\",&#10;  \"sort_value\": \"2026-08-04T08:31:00+02:00\"&#10;}</code></pre></td>\n\
        \    </tr>\n    <tr>\n      <td><strong>WorkflowStatus</strong></td>\n      <td>Workflow status name, or null</td>\n      <td>The same string or null</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": \"In progress\",&#10;  \"sort_value\": \"In progress\"&#10;}</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>WorkflowUsage</strong></td>\n      <td>Translated Yes/No, \"Yes\" with a translated \"default\" suffix for the default workflow, or translated \"Archived\"</td>\n      <td>The same string</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": \"Yes\",&#10;  \"sort_value\": \"Yes\"&#10;}</code></pre></td>\n    </tr>\n  </tbody>\n</table>\n\nA current-user FollowCompanies column resolves against the user who ran the\nsegment. For an API-started run, this is the token's user.\n\n<hr>\n\n### PeriodLocked shape\n\n\
        Always an object except for the `filter_error` case.\n\n<table>\n  <thead>\n    <tr>\n      <th>field</th>\n      <th>possible values</th>\n      <th>description</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>status</strong></td>\n      <td>not_locked, locked, permanently_locked</td>\n      <td>Lock state; also used as sort_value</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">\"locked\"</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>locked_at</strong></td>\n      <td>ISO 8601 timestamp or null</td>\n      <td>When the period was locked; null while unlocked</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">\"2026-02-14T10:22:31+01:00\"</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>locked_by_name</strong></td>\n      <td>String or null</td>\n      <td>Who locked it; null while unlocked or when a lock has no recorded author</td>\n \
        \   </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">\"Marie Dubois\"</code></pre></td>\n    </tr>\n  </tbody>\n</table>\n\n<hr>\n\n### PreparationAndReview shapes\n\nBranch on the key present in `formatted_value`.\n\n<table>\n  <thead>\n    <tr>\n      <th>shape</th>\n      <th>fields and possible values</th>\n      <th>sort_value</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>Nothing to report</strong></td>\n      <td>no_data is always true and is the only key</td>\n      <td>null</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": {&#10;    \"no_data\": true&#10;  },&#10;  \"sort_value\": null&#10;}</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>Workflow preparation</strong></td>\n      <td>label is preparation_not_started, partially_prepared or prepared; prepared_count and total_count are numbers; users contains name and user_id</td>\n\
        \      <td>prepared_count as a percentage of total_count, rounded down</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": {&#10;    \"label\": \"partially_prepared\",&#10;    \"prepared_count\": 4,&#10;    \"total_count\": 9,&#10;    \"users\": [&#10;      {&#10;        \"name\": \"Jan Peeters\",&#10;        \"user_id\": 3312&#10;      }&#10;    ]&#10;  },&#10;  \"sort_value\": 44&#10;}</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>Workflow review</strong></td>\n      <td>label is review_not_started, partially_reviewed or reviewed; reviewed_count excludes invalidated reviews; users contains only reviews that still stand</td>\n      <td>reviewed_count as a percentage of total_count, rounded down</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": {&#10;    \"label\": \"partially_reviewed\",&#10;    \"reviewed_count\"\
        : 2,&#10;    \"total_count\": 8,&#10;    \"users\": [&#10;      {&#10;        \"name\": \"Marie Dubois\",&#10;        \"user_id\": 4471&#10;      }&#10;    ]&#10;  },&#10;  \"sort_value\": 25&#10;}</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>One template, preparation</strong></td>\n      <td>preparation contains name, user_id and time, or is null when nobody prepared the template</td>\n      <td>Preparation time, or null</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": {&#10;    \"preparation\": {&#10;      \"name\": \"Jan Peeters\",&#10;      \"user_id\": 3312,&#10;      \"time\": \"2026-07-21T14:03:11.000+02:00\"&#10;    }&#10;  },&#10;  \"sort_value\": \"2026-07-21T14:03:11+02:00\"&#10;}</code></pre><pre><code class=\"language-json\">{&#10;  \"formatted_value\": {&#10;    \"preparation\": null&#10;  },&#10;  \"sort_value\": null&#10;}</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>One\
        \ template, review</strong></td>\n      <td>reviews contains name, user_id, time and outdated_at; the run user's review comes first, followed by oldest to newest; invalidated reviews remain; an empty array means nobody reviewed</td>\n      <td>Most recent review time including outdated reviews, or null for an empty array</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": {&#10;    \"reviews\": [&#10;      {&#10;        \"name\": \"Marie Dubois\",&#10;        \"user_id\": 4471,&#10;        \"time\": \"2026-07-22T08:15:40.000+02:00\",&#10;        \"outdated_at\": null&#10;      }&#10;    ]&#10;  },&#10;  \"sort_value\": \"2026-07-22T08:15:40+02:00\"&#10;}</code></pre></td>\n    </tr>\n  </tbody>\n</table>\n\nWorkflow `users` array order is not significant.\n\n<hr>\n\n### SyncsInformation shapes\n\n`settings.scope_type` selects the shape. `settings.category` selects the\nbookkeeping or administration connection;\
        \ null or absent means bookkeeping.\n\n<table>\n  <thead>\n    <tr>\n      <th>scope_type</th>\n      <th>formatted_value</th>\n      <th>sort_value</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>sync_name</strong></td>\n      <td>Sync name, or null with no connection</td>\n      <td>The same string or null</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": \"Exact Online\",&#10;  \"sort_value\": \"Exact Online\"&#10;}</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>sync_type</strong></td>\n      <td>Sync type, or null with no connection</td>\n      <td>The same string or null</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": \"ExactOnline\",&#10;  \"sort_value\": \"ExactOnline\"&#10;}</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>sync_reference</strong></td>\n      <td>Client\
        \ name with its reference in brackets, bare reference when the name cannot be resolved, or null with no connection</td>\n      <td>The same string or null</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": \"Acme NV (ACME001)\",&#10;  \"sort_value\": \"Acme NV (ACME001)\"&#10;}</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>sync_status</strong></td>\n      <td>Object whose fields depend on status</td>\n      <td>The status</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": {&#10;    \"status\": \"failed\",&#10;    \"timestamp\": \"2026-08-03T22:05:12+02:00\",&#10;    \"error_message\": \"An error has occurred.\"&#10;  },&#10;  \"sort_value\": \"failed\"&#10;}</code></pre></td>\n    </tr>\n  </tbody>\n</table>\n\n| status | timestamp | error_message | meaning |\n| ------ | --------- | ------------- | ------- |\n\
        | **synchronised** | Present | Absent | Last sync completed |\n| **failed** | Present | Present, but can be null | Last sync faulted |\n| **canceled** | Present | Absent | Last sync was cancelled |\n| **in_progress** | Absent | Absent | Sync is running or queued |\n| **not_synchronised** | Absent | Absent | No sync connection |\n| **no_sync_data** | Absent | Absent | Connected, but nothing has synced yet |\n\n`error_message` is readable interface text rather than raw internals. It can\ncontain simple HTML markup such as `<strong>`.\n\n<hr>\n\n### TemplateStarring shapes\n\n<table>\n  <thead>\n    <tr>\n      <th>kind</th>\n      <th>formatted_value fields</th>\n      <th>sort_value</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>accounts</strong></td>\n      <td>status is starred, partially_starred or not_starred; starred_count and total_count are numbers</td>\n      <td>Starred count</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code\
        \ class=\"language-json\">{&#10;  \"formatted_value\": {&#10;    \"kind\": \"accounts\",&#10;    \"status\": \"partially_starred\",&#10;    \"starred_count\": 2,&#10;    \"total_count\": 5&#10;  },&#10;  \"sort_value\": 2&#10;}</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>reconciliation</strong></td>\n      <td>starred is true or false</td>\n      <td>1 when starred, 0 otherwise</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">{&#10;  \"formatted_value\": {&#10;    \"kind\": \"reconciliation\",&#10;    \"starred\": true&#10;  },&#10;  \"sort_value\": 1&#10;}</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>Not applicable</strong></td>\n      <td>Empty string when no period accounts belong to the account detail template, or the client file has no such reconciliation</td>\n      <td>-1 for accounts, 0 for reconciliation</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"\
        language-json\">{&#10;  \"formatted_value\": \"\",&#10;  \"sort_value\": -1&#10;}</code></pre></td>\n    </tr>\n  </tbody>\n</table>\n\n<hr>\n\n### Todos shape\n\nAlways an object except for the `filter_error` case.\n\n<table>\n  <thead>\n    <tr>\n      <th>field</th>\n      <th>possible values</th>\n      <th>description</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>status</strong></td>\n      <td>not_done, partially_done, done, null</td>\n      <td>Completion state; null when the period has no to-dos</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">\"partially_done\"</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>completed</strong></td>\n      <td>Number</td>\n      <td>How many to-dos are done</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">3</code></pre></td>\n    </tr>\n    <tr>\n      <td><strong>total</strong></td>\n      <td>Number</td>\n\
        \      <td>How many to-dos there are</td>\n    </tr>\n    <tr>\n      <td></td>\n      <td colspan=\"2\"><pre><code class=\"language-json\">7</code></pre></td>\n    </tr>\n  </tbody>\n</table>\n\n`sort_value` is the number of open to-dos, `total` minus `completed`.\n\nThis endpoint exists in API v4 only; on the deprecated v3 API it returns a 404.\n\nThis endpoint requires a user OAuth token and Insights Premium.<br>\n<b>Required scope:</b> `insights:read`\n"
      security:
      - OAuth2:
        - insights:read
      operationId: getInsightsSegmentResults
      parameters:
      - $ref: '#/components/parameters/InsightsFirmId'
      - $ref: '#/components/parameters/InsightsSegmentId'
      - name: page
        in: query
        description: Page of results to fetch
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        description: Number of results to return per page
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 200
      responses:
        '200':
          description: The results of the latest finished run
          headers:
            Total:
              description: Total number of matching companies accessible to the user
              schema:
                type: integer
            Per-Page:
              description: Effective number of results requested per page
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsSegmentResults'
        '202':
          description: The latest run is still in progress; its status and progress are returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsSegmentRunPendingWithMessage'
        '403':
          description: The token is an application token (a user token is required), or the firm does not have Insights Premium
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsError'
        '404':
          description: The segment does not exist or is not accessible, or no calculated results are available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsError'
  /api/v4/f/{firm_id}/segments/{id}/runs:
    post:
      tags:
      - Insights
      summary: Run an Insights segment
      description: 'Runs the segment for the authenticated user and returns immediately with a run

        reference and its status; it does not wait for the segment run to finish. The

        run only covers the companies the token''s user can access in Silverfin, and

        never changes the segment''s definition.


        If a run of this segment is already in progress, no new run is started. The

        response describes that pending run with the pending payload documented on

        `GET /segments/{id}/results`, without its `message`. Poll that endpoint

        until it finishes.


        If the user''s latest run of the segment finished less than

        12 hours ago, no new run is started either. The 200 response

        describes that finished run (`status` is `finished`) and carries a `message`

        and `next_run_allowed_at`, the earliest time (ISO 8601) a request can start a

        new run. A request at that time can still get a 409 at the firm''s limit.

        Fetch the results from `GET /segments/{id}/results`. Runs started in the

        Silverfin UI count as well. A change to the segment''s filters or period

        removes the earlier runs, so the next request starts a new run at once.


        Otherwise a new execution is created (a 202): there is no run yet, or the

        latest run was cancelled or finished 12 hours ago or more. The

        results of that earlier run are discarded.


        A firm can have a limited number of runs in progress at the same time;

        further requests are rejected with a 409 until a run

        finishes. Runs started from the Silverfin UI count towards that limit.

        Only the firm''s own segments can be run through the API; recommended

        segments cannot.


        This endpoint exists in API v4 only; on the deprecated v3 API it returns a 404.


        This endpoint requires a user OAuth token and Insights Premium.<br>

        <b>Required scope:</b> `insights:write`

        '
      security:
      - OAuth2:
        - insights:write
      operationId: runInsightsSegment
      parameters:
      - $ref: '#/components/parameters/InsightsFirmId'
      - $ref: '#/components/parameters/InsightsSegmentId'
      responses:
        '200':
          description: A run is in progress, or the latest finished run is less than 12 hours old; no new run is started and that run is described
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/InsightsSegmentRunPending'
                - $ref: '#/components/schemas/InsightsSegmentRunRecentlyFinished'
        '202':
          description: A new segment run was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsSegmentRunPending'
        '403':
          description: The token is an application token (a user token is required), or the firm does not have Insights Premium
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsError'
        '404':
          description: The segment does not exist, is not accessible, or is not one of the firm's own segments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsError'
        '409':
          description: The firm already has the maximum number of segment runs in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsError'
