    post:
      tags:
      - Personal Income Tax
      summary: Attach a document to PIT workflow
      description: 'Attach a PDF document to the PIT workflow for the specified year. <br>

        <b>Required scope(s):</b> `financials:write`

        '
      security:
      - OAuth2:
        - financials:write
      operationId: attachPersonalIncomeTaxDocument
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
        description: The firm ID
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
        description: The company ID
      - name: year
        in: path
        schema:
          type: integer
        required: true
        description: The tax year (e.g., 2024)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - source
              properties:
                file:
                  type: string
                  format: binary
                  description: A PDF document to attach to the PIT workflow
                source:
                  type: string
                  enum:
                  - my_minfin
                  - tax_on_web
                  - questionnaire
                  - manual
                  description: Declares where this file is originating from
      responses:
        '201':
          description: Document attached successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Document ID
                  name:
                    type: string
                    description: Document name
                  downloadable:
                    type: boolean
                  size:
                    type: integer
                    description: File size in bytes
                  content_type:
                    type: string
                    description: MIME type of the document
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
