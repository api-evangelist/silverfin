          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTemplateCreateResponse'
