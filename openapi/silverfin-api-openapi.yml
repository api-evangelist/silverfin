        required: true
      - name: shared_part_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: Identifier of the account template
      responses:
        '204':
          description: Successful empty body response
    post:
      tags:
      - Templates
      summary: Add a shared part to an account template
      description: 'Add a shared part to an account template. <br>

        <b>Required scope(s):</b> `administration:write`

        '
      security:
      - OAuth2:
        - administration:write
      operationId: addSharedPartToAccountTemplate
      parameters:
      - name: Accept
        in: header
