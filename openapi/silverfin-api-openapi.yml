components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://live.getsilverfin.com/oauth/authorize
          tokenUrl: https://live.getsilverfin.com/oauth/token
          scopes:
            administration:read: ''
            administration:write: ''
            client_meetings:read: ''
            client_meetings:external_notes:write: ''
            communication:read: ''
            communication:write: ''
            financials:read: ''
            financials:write: ''
            financials:transactions:read: ''
            financials:transactions:write: ''
            insights:read: ''
            insights:write: ''
            workflows:read: ''
            workflows:write: ''
            permanent_documents:read: ''
            permanent_documents:write: ''
            webhooks: ''
            links: ''
            user:email: ''
            user:firm: ''
            user:profile: ''
  parameters:
    InsightsFirmId:
      name: firm_id
      in: path
      required: true
      schema:
        type: integer
    InsightsSegmentId:
      name: id
      in: path
      required: true
      description: Segment id
      schema:
        type: integer
  schemas:
    InsightsError:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    InsightsSegmentRunBase:
      type: object
      required:
      - status
      - request_ref
      - started_at
      - finished_at
      properties:
        status:
          type: string
          enum:
          - pending
          - finished
        request_ref:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
          description: Run creation time, with millisecond precision
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: Calculation completion time, or null while pending
    InsightsSegmentRunPending:
      allOf:
      - $ref: '#/components/schemas/InsightsSegmentRunBase'
      - type: object
        required:
        - progress
        properties:
          status:
            type: string
            enum:
            - pending
          progress:
            type: object
            required:
            - processed_companies
            properties:
              processed_companies:
                type: integer
                minimum: 0
                description: 'Companies processed so far. Informational only: a two-pass run can count a company more than once.'
    InsightsSegmentRunRecentlyFinished:
      allOf:
      - $ref: '#/components/schemas/InsightsSegmentRunBase'
      - type: object
        required:
        - message
        - next_run_allowed_at
        properties:
          status:
            type: string
            enum:
            - finished
          finished_at:
            type: string
            format: date-time
          next_run_allowed_at:
            type: string
            format: date-time
            description: 'The earliest time a request can start a new run: 12 hours after finished_at'
          message:
            type: string
            example: The latest results of this segment are less than 12 hours old, so no new run was started. Fetch them from GET segments/123/results. A new run can start at next_run_allowed_at.
    InsightsSegmentRunPendingWithMessage:
      allOf:
      - $ref: '#/components/schemas/InsightsSegmentRunPending'
      - type: object
        required:
        - message
        properties:
          message:
            type: string
            example: The segment run is not ready yet. Poll this endpoint until it finishes.
    InsightsSegmentResults:
      allOf:
      - $ref: '#/components/schemas/InsightsSegmentRunBase'
      - type: object
        required:
        - period_selection
        - columns
        - matches
        - pagination
        - non_match_count
        properties:
          status:
            type: string
            enum:
            - finished
          finished_at:
            type: string
            format: date-time
          period_selection:
            $ref: '#/components/schemas/InsightsPeriodSelection'
          columns:
            type: array
            items:
              $ref: '#/components/schemas/InsightsSegmentColumn'
          matches:
            type: array
            items:
              $ref: '#/components/schemas/InsightsSegmentMatch'
          pagination:
            $ref: '#/components/schemas/InsightsPagination'
          non_match_count:
            type: integer
            minimum: 0
    InsightsPeriodSelection:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - financial_year
          - accounting_period
          - active_period
          - completed_period
        date:
          type: string
          format: date
          nullable: true
          description: Present for financial_year and accounting_period selections
        locking_type:
          type: string
          enum:
          - locked
          - permanently_locked
          nullable: true
          description: Present for active_period and completed_period selections
    InsightsSegmentColumn:
      type: object
      required:
      - uuid
      - type
      - name
      - settings
      properties:
        uuid:
          type: string
          format: uuid
          description: Correlates this column with values in this response only; it is not a stable identifier across runs.
        type:
          type: string
          nullable: true
          example: Todos
        name:
          type: string
          nullable: true
          example: To-dos
        settings:
          type: object
          nullable: true
          additionalProperties: true
    InsightsSegmentMatch:
      type: object
      required:
      - company_id
      - company_name
      - period_id
      - period_end_date
      - values
      properties:
        company_id:
          type: integer
        company_name:
          type: string
        period_id:
          type: integer
        period_end_date:
          type: string
          format: date
        values:
          type: object
          description: Values keyed by the corresponding column uuid
          additionalProperties:
            $ref: '#/components/schemas/InsightsFilterValue'
    InsightsFilterValue:
      type: object
      nullable: true
      required:
      - formatted_value
      - sort_value
      properties:
        formatted_value:
          description: Translated display output. Depending on filter type, this is a string, object, number, boolean, or null.
        sort_value:
          description: Stable sortable representation. Depending on filter type, this is a string, number, boolean, or null.
        filter_error:
          type: string
          description: Present only when this filter could not be calculated
    InsightsPagination:
      type: object
      required:
      - page
      - per_page
      - total_matches
      - total_pages
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 1000
        total_matches:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 1
    TextPart:
      type: object
      required:
      - name
      - content
      properties:
        name:
          type: string
          example: part_name
        content:
          type: string
          example: '{% comment %}liquid code in part{% endcomment %}'
    ExportFileTemplateNew:
      type: object
      required:
      - name
      - file_name
      properties:
        name:
          type: string
          example: Export File Name
        name_nl:
          type: string
          example: Export file name (nl)
        name_en:
          type: string
          example: Export file name (en)
        name_fr:
          type: string
          example: Export file name (fr)
        name_de:
          type: string
          example: Export file name (de)
        name_da:
          type: string
          example: Export file name (da)
        name_se:
          type: string
          example: Export file name (se)
        file_name:
          type: string
          example: export_file.sxbrl
        enconding:
          type: string
          example: UTF-8
        externally_managed:
          type: boolean
