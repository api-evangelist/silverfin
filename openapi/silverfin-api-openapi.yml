openapi: 3.0.0
info:
  title: Silverfin API
  description: 'This is the currently supported stable version of the Silverfin API.

    It''s based on OAuth so you need a `client_id` and `client_secret`

    to connect. This can be requested by a mail to info@getsilverfin.com


    ## OAuth endpoints


    * authorization url: https://live.getsilverfin.com/oauth/authorize

    * access token url: https://live.getsilverfin.com/oauth/token


    When you redirect to the authorize url, you can pass the requested

    scopes in the url with the `scope` parameter. The scopes should be

    separated with spaces.


    ## OAuth flow


    We use standard OAuth. The typical flow goes like this:


    1. GET request to oauth/authorize with url parameters: `client_id`, `redirect_uri`, `scope` (a space separated list of requested scopes) and `response_type=code`

    2. This will redirect the browser to a GET request on `redirect_uri` with a url parameter `code`

    3. With this code you can do a server side POST to oauth/token with parameters: `client_id`, `client_secret`, `code`, `redirect_uri` and `grant_type=authorization_code`


    After following these steps, you will have an access token and a

    refresh token. The access token is valid for 10 minutes. With the

    refresh token, you can request a new access token. In the response

    you get an access token and a new refresh token. The refresh token

    doesn''t expire, but can only be used once.


    You can request a new access token & refresh token by doing


    4. POST to to oauth/token with parameters: `client_id`, `client_secret`, `refresh_token`, `redirect_uri` and `grant_type=refresh_token`, so the same as for getting the initial access token, but with another `grant_type` and `refresh_token` instead of `code`


    ## Scopes

    We currently support the following scopes: `user:email`, `webhooks`,

    `administration:read`, `administration:write`, `permanent_documents:read`,

    `permanent_documents:write`, `communication:read`, `communication:write`,

    `financials:read`.


    The scopes are also coupled to the application and added to the

    application based on your needs.


    ## Postman


    The postman library will provide you with all the endpoints currently available in the Silverfin API.


    To setup the library, just import it directly into your Postman and this should add a new collection called `Silverfin Oauth API Live` into your Postman. In the top right of your Postman a new environment should also be added called `Silverfin Live`. In order to setup the Postman library correctly, you will find a number of variables setup in the environment `client_id` `secret` `access_token` `refresh_token` `expires_at` `callback_url` `firm_id`. The only ones that you need to modify are the `client_id`,`secret`,`firm_id`,and `callback_url`.


    Once you''ve set these variables, you can click on the `Silverfin OAuth API Live` collection, and you''ll find one more variables set up in this collection as well: `base_url`. You don''t really need to modify this but if you are working on a sandbox environment from Silverfin, then you have to change the url from `api.getsilverfin.com` towards `sandbox.getsilverfin.com`.'
  version: 1.0.0
servers:
- url: https://live.getsilverfin.com
paths:
  /api/v4/f/{firm_id}/account_mapping_lists:
    get:
      tags:
      - Account Mapping Lists
      summary: List all account mapping lists
      description: 'List all account mapping lists. <br>

        <b>Required scope(s):</b> `administration:read`

        '
      security:
      - OAuth2:
        - administration:read
      operationId: getAccountMappingLists
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: account_mapping_list_id
                    name:
                      type: string
                    automatic_suffix:
                      type: boolean
                    use_original_account_names:
                      type: boolean
                    marketplace_template_id:
                      type: integer
                    marketplace_template_version:
                      type: string
  /api/v4/f/{firm_id}/account_mapping_lists/{account_mapping_list_id}:
    get:
      tags:
      - Account Mapping Lists
      summary: List all mappings in an account mapping list.
      description: 'List all mappings in an account mapping list. <br>

        <b>Required scope(s):</b> `administration:read`

        '
      security:
      - OAuth2:
        - administration:read
      operationId: getAccountMappingByAccountMappingListId
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: account_mapping_list_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    number:
                      type: string
                    original_number:
                      type: string
                    account_type:
                      type: string
                    name_nl:
                      type: string
                    name_fr:
                      type: string
                    name_en:
                      type: string
                    name_da:
                      type: string
  /api/v4/f/{firm_id}/account_templates:
