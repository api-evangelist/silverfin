        company. A meeting can have up to 5 attachments. Upload one file per

        request — call this endpoint repeatedly to attach multiple files.<br><br>

        Supported file types: .aac .flac .mp3 .mpa .mpeg .mpga .mp4 .opus .pcm

        .wav .webm .png .jpg .jpeg .webp .txt .pdf<br>

        <b>Required scope:</b> `client_meetings:external_notes:write`

        '
      security:
      - OAuth2:
        - client_meetings:external_notes:write
      operationId: createClientMeetingAttachment
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                bot_name:
                  type: string
                  description: 'Custom name to display as the uploader, if left empty, we use

                    the authenticated user''s name

                    '
                content:
                  type: string
                  format: binary
              required:
              - content
      parameters:
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '204':
          description: File is successfully uploaded
        '422':
          description: 'Possible reasons:<br>

            - The company has no current meeting

