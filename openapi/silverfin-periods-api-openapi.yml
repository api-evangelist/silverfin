openapi: 3.2.0
info:
  title: Silverfin Periods API
  description: This is the currently supported stable version of the Silverfin API.
  version: 1.0.0
servers:
- url: https://live.getsilverfin.com
tags:
- name: Periods
paths:
  /api/v4/f/{firm_id}/companies/{company_id}/periods:
    get:
      tags:
      - Periods
      summary: List all periods of a company
      description: 'List all periods of a company.


        Required scope(s): `communication:read, financials:read`'
      security:
      - OAuth2:
        - communication:read, financials:read
      operationId: getPeriods
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 200
      - name: public
        in: query
        schema:
          type: boolean
          description: If set to true, then only the public periods will be listed in the response.  If set to false, only private periods will be provided. Leave blank if you want to return all periods.
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: period_id
                    end_date:
                      type: string
                    public:
                      type: boolean
                    fiscal_year:
                      type: object
                      properties:
                        start_date:
                          type: string
                        end_date:
                          type: string
                    extra_data_headers:
                      type: array
                      items:
                        type: string
                    locked:
                      type: boolean
                    locked_permanently:
                      type: boolean
    post:
      tags:
      - Periods
      summary: Add a period
      description: 'Add a period.


        Required scope(s): `financials:write`'
      security:
      - OAuth2:
        - financials:write
      operationId: createPeriod
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                end_date:
                  type: string
                  format: date
              required:
              - end_date
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: period_id
                  end_date:
                    type: string
                  public:
                    type: boolean
                  fiscal_year:
                    type: object
                    properties:
                      start_date:
                        type: string
                      end_date:
                        type: string
                  extra_data_headers:
                    type: array
                    items:
                      type: string
                  locked:
                    type: boolean
  /api/v4/f/{firm_id}/companies/{company_id}/periods/public:
    post:
      tags:
      - Periods
      summary: Updates which periods should be public
      description: 'Pass the end date of a known period to mark that period AND all the

        previous periods as public. The date must be the end date of an existing

        period.

        All periods that start after this date will become private for external

        users.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: updatePeriodsPublicFlag
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
              required:
              - date
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: period_id
                    end_date:
                      type: string
                    public:
                      type: boolean
                    fiscal_year:
                      type: object
                      properties:
                        start_date:
                          type: string
                        end_date:
                          type: string
                    extra_data_headers:
                      type: array
                      items:
                        type: string
                    locked:
                      type: boolean
  /api/v4/f/{firm_id}/companies/{company_id}/periods/{period_id}:
    get:
      tags:
      - Periods
      summary: Get information about a single period
      description: 'Get information about a single period.


        Required scope(s): `communication:read, financials:read`'
      security:
      - OAuth2:
        - communication:read, financials:read
      operationId: getPeriodDetails
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: period_id
                  end_date:
                    type: string
                  public:
                    type: boolean
                  fiscal_year:
                    type: object
                    properties:
                      start_date:
                        type: string
                      end_date:
                        type: string
                  extra_data_headers:
                    type: array
                    items:
                      type: string
                  locked:
                    type: boolean
                  locked_permanently:
                    type: boolean
  /api/v4/f/{firm_id}/companies/{company_id}/periods/{period_id}/custom:
    get:
      tags:
      - Periods
      summary: Get custom period parameters
      description: 'Get custom period parameters.


        Required scope(s): `administration:read`'
      security:
      - OAuth2:
        - administration:read
      operationId: getPeriodCustomProperties
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept-Language
        in: header
        schema:
          type: string
        example: en
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    namespace:
                      type: string
                    key:
                      type: string
                    value:
                      type: string
                    owner:
                      type: object
                      properties:
                        id:
                          type: integer
                        type:
                          type: string
                    documents:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          file_name:
                            type: string
                          content:
                            type: string
                          download_url:
                            type: string
                          periods:
                            type: array
                            items:
                              type: string
                          created_by:
                            type: string
                    updated_by_id:
                      type: integer
    post:
      tags:
      - Periods
      summary: Post a custom property to a period
      description: 'Submit one or more custom properties by posting an array in properties

        containing objects with namespace, key and value.


        Required scope(s): `administration:write`'
      security:
      - OAuth2:
        - administration:write
      operationId: createPeriodCustomProperties
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                properties[][namespace]:
                  type: string
                properties[][key]:
                  type: string
                properties[][value]:
                  type: string
                properties[][documents][][content]:
                  type: string
                  format: binary
              required:
              - properties[][namespace]
              - properties[][key]
              - properties[][value]
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: firm_id
        in: path
        schema:
          type: integer
        required: true
      - name: company_id
        in: path
        schema:
          type: integer
        required: true
      - name: period_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: Successful response
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://live.getsilverfin.com/oauth/authorize
          tokenUrl: https://live.getsilverfin.com/oauth/token
          scopes:
            administration:read: ''
            administration:write: ''
            client_meetings:read: ''
            client_meetings:external_notes:write: ''
            communication:read: ''
            communication:write: ''
            financials:read: ''
            financials:write: ''
            financials:transactions:read: ''
            financials:transactions:write: ''
            insights:read: ''
            insights:write: ''
            workflows:read: ''
            workflows:write: ''
            permanent_documents:read: ''
            permanent_documents:write: ''
            webhooks: ''
            links: ''
            user:email: ''
            user:firm: ''
            user:profile: ''
